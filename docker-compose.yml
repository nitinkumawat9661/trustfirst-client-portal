services:
  postgres:
    image: postgres:16-alpine
    container_name: trustfirst-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: trustfirst
      POSTGRES_PASSWORD: trustfirst
      POSTGRES_DB: trustfirst
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustfirst -d trustfirst"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: trustfirst-web
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://trustfirst:trustfirst@postgres:5432/trustfirst?schema=public
      AUTH_URL: http://localhost:3000
    ports:
      - "3000:3000"

volumes:
  postgres-data:
