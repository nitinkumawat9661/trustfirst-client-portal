services:
  postgres:
    image: postgres:16-alpine
    container_name: trustfirst-manglam-demo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: trustfirst_manglam_demo
      POSTGRES_USER: trustfirst_demo
      POSTGRES_PASSWORD: trustfirst_demo
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustfirst_demo -d trustfirst_manglam_demo"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - trustfirst_manglam_demo_pgdata:/var/lib/postgresql/data

volumes:
  trustfirst_manglam_demo_pgdata:
