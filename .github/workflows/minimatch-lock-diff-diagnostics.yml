name: Minimatch Lock Diff Diagnostics

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/minimatch-lock-diff-diagnostics.yml"
      - "package-lock.json"
      - "package.json"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: agent/patch-minimatch-audit
          fetch-depth: 0

      - name: Compare package-lock package nodes
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:package-lock.json > /tmp/base-lock.json
          node <<'NODE'
          const fs = require('fs');
          const base = JSON.parse(fs.readFileSync('/tmp/base-lock.json', 'utf8')).packages || {};
          const head = JSON.parse(fs.readFileSync('package-lock.json', 'utf8')).packages || {};
          const keys = [...new Set([...Object.keys(base), ...Object.keys(head)])].sort();
          const added = [];
          const removed = [];
          const versionChanged = [];
          const metadataChanged = [];
          for (const key of keys) {
            const before = base[key];
            const after = head[key];
            if (!before) {
              added.push({ key, version: after?.version ?? null });
              continue;
            }
            if (!after) {
              removed.push({ key, version: before?.version ?? null });
              continue;
            }
            if ((before.version ?? null) !== (after.version ?? null)) {
              versionChanged.push({ key, before: before.version ?? null, after: after.version ?? null });
              continue;
            }
            const stable = (value) => JSON.stringify(value, Object.keys(value || {}).sort());
            if (stable(before) !== stable(after)) {
              metadataChanged.push({ key, version: after.version ?? null });
            }
          }
          console.log(JSON.stringify({
            counts: {
              added: added.length,
              removed: removed.length,
              versionChanged: versionChanged.length,
              metadataChanged: metadataChanged.length,
            },
            added,
            removed,
            versionChanged,
            metadataChanged: metadataChanged.slice(0, 100),
          }, null, 2));
          if (versionChanged.length > 25) {
            console.error('Too many unrelated package version changes.');
            process.exit(1);
          }
          NODE
