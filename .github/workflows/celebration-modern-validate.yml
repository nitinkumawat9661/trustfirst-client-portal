name: Validate Celebration Modern Storefront

on:
  push:
    branches:
      - sync/celebration-modern-storefront

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: celebration-site
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v5
      - name: Install and validate
        run: |
          set -euo pipefail
          npm ci
          npm audit --omit=dev
          npm run audit
          npm run typecheck
          npm run build
