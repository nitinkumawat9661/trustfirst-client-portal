name: Materialize Estimate Print Content Fix

on:
  push:
    branches:
      - agent/fix-estimate-print-content

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-estimate-print-content
          fetch-depth: 0
      - name: Materialize scoped source changes
        run: node scripts/materialize-estimate-print-content-fix.mjs
      - name: Commit materialized source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src e2e/mangalam-erp.spec.ts
          git commit -m "fix: correct Estimate bill totals and print content"
          git push origin HEAD:agent/fix-estimate-print-content
