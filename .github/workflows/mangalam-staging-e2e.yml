name: Mangalam Staging E2E

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/mangalam-staging-e2e.yml"
      - "apps/web/**"
      - "packages/**"
      - "scripts/**"
      - "e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mangalam-staging-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  staging-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: trustfirst_mangalam_staging
          POSTGRES_PASSWORD: trustfirst_staging
          POSTGRES_USER: trustfirst_staging
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trustfirst_staging -d trustfirst_mangalam_staging"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      AUTH_SECRET: mangalam-staging-auth-secret-2026-not-production
      AUTH_TRUST_HOST: "true"
      AUTH_URL: http://127.0.0.1:3100
      DATABASE_URL: postgresql://trustfirst_staging:trustfirst_staging@127.0.0.1:5432/trustfirst_mangalam_staging?schema=public
      E2E_BASE_URL: http://127.0.0.1:3100
      MANGLAM_DEMO_ADMIN_EMAIL: mangalam-staging-admin@trustfirst.example.com
      MANGLAM_DEMO_ADMIN_PASSWORD: MangalamStaging!2026
      NEXTAUTH_URL: http://127.0.0.1:3100
      NODE_ENV: production
      TRUSTFIRST_DEMO_MODE: staging
    steps:
      - name: Check out pull request merge ref
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply migrations to disposable staging database
        run: npm exec --workspace @trustfirst/database -- prisma migrate deploy --schema prisma/schema.prisma

      - name: Seed disposable Mangalam staging tenant
        run: node scripts/seed-manglam-demo.mjs

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and service tests
        run: npm test

      - name: Production build against staging database
        run: npm run build --workspace @trustfirst/web

      - name: Validate backup script syntax
        run: bash -n scripts/vps-mangalam-daily-backup.sh

      - name: Install isolated browser test runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/trustfirst-playwright
          npm install --prefix /tmp/trustfirst-playwright --ignore-scripts --no-audit --no-fund @playwright/test@1.55.0
          ln -s /tmp/trustfirst-playwright/node_modules/@playwright node_modules/@playwright
          ln -s /tmp/trustfirst-playwright/node_modules/playwright node_modules/playwright
          ln -s /tmp/trustfirst-playwright/node_modules/playwright-core node_modules/playwright-core

      - name: Install Chromium
        run: /tmp/trustfirst-playwright/node_modules/.bin/playwright install --with-deps chromium

      - name: Start isolated staging application
        shell: bash
        run: |
          set -euo pipefail
          npm run start --workspace @trustfirst/web -- -p 3100 > /tmp/mangalam-staging-app.log 2>&1 &
          echo $! > /tmp/mangalam-staging-app.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:3100/sign-in >/dev/null; then
              echo "Staging application is healthy."
              exit 0
            fi
            sleep 2
          done
          cat /tmp/mangalam-staging-app.log
          exit 1

      - name: Run browser end-to-end journey
        run: /tmp/trustfirst-playwright/node_modules/.bin/playwright test

      - name: Verify browser transactions in PostgreSQL
        run: node scripts/verify-staging-e2e.mjs

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mangalam-staging-e2e-${{ github.run_id }}
          path: |
            playwright-report
            test-results/playwright
            /tmp/mangalam-staging-app.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop staging application
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/mangalam-staging-app.pid ]; then
            kill "$(cat /tmp/mangalam-staging-app.pid)" 2>/dev/null || true
          fi
