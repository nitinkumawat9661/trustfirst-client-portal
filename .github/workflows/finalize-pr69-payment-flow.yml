name: Finalize PR 69 payment flow

on:
  push:
    branches:
      - main
    paths:
      - .github/pr69-payment-flow-trigger.txt
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: finalize-pr69-payment-flow
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event_name == 'push' || github.event.pull_request.number == 69
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout payment branch
        uses: actions/checkout@v4
        with:
          ref: fix/post-bill-payment-accounting
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply guarded payment flow
        run: node scripts/finalize-post-bill-payment-flow.mjs

      - name: Format changed files
        run: |
          npx prettier --write \
            apps/web/src/app/'(platform)'/admin/hardware/purchases/new/page.tsx \
            apps/web/src/components/hardware/bill-payment-choice-regression.test.ts \
            apps/web/src/components/hardware/bill-payment-confirmation-dialog.tsx \
            apps/web/src/components/hardware/estimate-bill-form.tsx \
            apps/web/src/components/hardware/hardware-trade-form.tsx \
            apps/web/src/components/hardware/quick-pos-form.tsx

      - name: Focused payment regression
        run: npm run test --workspace @trustfirst/web -- src/components/hardware/bill-payment-choice-regression.test.ts

      - name: Web lint
        run: npm run lint --workspace @trustfirst/web

      - name: Web typecheck
        run: npm run typecheck --workspace @trustfirst/web

      - name: Web production build
        run: npm run build --workspace @trustfirst/web

      - name: Diff safety
        run: git diff --check

      - name: Remove temporary branch helpers
        run: |
          rm -f \
            scripts/apply-post-bill-payment-flow.mjs \
            scripts/finalize-post-bill-payment-flow.mjs \
            .github/workflows/apply-post-bill-payment-flow.yml \
            apps/web/src/app/api/internal/branch-archive/route.ts

      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: confirm payment after sales and purchase bills"
          git push origin HEAD:fix/post-bill-payment-accounting

      - name: Report success
        run: gh pr comment 69 --repo "$GITHUB_REPOSITORY" --body "Validated implementation complete: focused payment regression, lint, typecheck, production build and diff safety passed."

      - name: Report failure
        if: failure()
        run: gh pr comment 69 --repo "$GITHUB_REPOSITORY" --body "PR 69 finalizer failed. Production was not changed. Inspect the latest **Finalize PR 69 payment flow** job before merging."
