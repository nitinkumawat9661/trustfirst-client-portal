name: Materialize Recommendation Hardening

on:
  push:
    branches:
      - feat/staging-e2e-party-backup-hardening

permissions:
  contents: write

concurrency:
  group: materialize-recommendation-hardening
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/staging-e2e-party-backup-hardening
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply readable source changes
        run: python3 scripts/apply-recommendation-hardening.py

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and service tests
        run: npm test

      - name: Production build
        run: npm run build --workspace @trustfirst/web

      - name: Validate operational scripts
        run: |
          bash -n scripts/vps-mangalam-daily-backup.sh
          node --check scripts/staging-env.mjs
          node --check scripts/staging-setup.mjs
          node --check scripts/staging-start.mjs
          node --check scripts/verify-staging-e2e.mjs

      - name: Remove one-time materializer
        run: |
          rm scripts/apply-recommendation-hardening.py
          rm .github/workflows/materialize-recommendation-hardening.yml

      - name: Commit readable verified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: harden party roles staging E2E and backups"
          git push origin HEAD:feat/staging-e2e-party-backup-hardening
