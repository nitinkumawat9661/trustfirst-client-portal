name: Full Dependency Audit Diagnostics

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/full-dependency-audit-diagnostics.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Materialize experimental patched lint tree
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.overrides = pkg.overrides || {};
          pkg.overrides.minimatch = '10.2.6';
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
          npm update minimatch --package-lock-only --include=dev --ignore-scripts
          rm -rf node_modules apps/*/node_modules packages/*/node_modules
          npm ci --include=dev

      - name: Verify patched dependency tree
        shell: bash
        run: |
          set -euo pipefail
          npm ls minimatch brace-expansion --all
          npm audit --audit-level=high
          npm audit --omit=dev --audit-level=high

      - name: Validate lint compatibility
        run: npm run lint

      - name: Validate types
        run: npm run typecheck

      - name: Run full tests
        run: npm test

      - name: Build production application
        run: npm run build --workspace @trustfirst/web
