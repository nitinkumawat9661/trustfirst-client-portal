name: Update payment status E2E selectors

on:
  push:
    branches:
      - fix/mangalam-stock-and-payment-status
    paths:
      - scripts/update-payment-status-e2e.mjs
      - .github/workflows/update-payment-status-e2e.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mangalam-stock-and-payment-status
          fetch-depth: 0
      - run: node scripts/update-payment-status-e2e.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/mangalam-erp.spec.ts
          git diff --cached --quiet && exit 0
          git commit -m "test: use stable payment status selectors"
          git push origin HEAD:fix/mangalam-stock-and-payment-status
