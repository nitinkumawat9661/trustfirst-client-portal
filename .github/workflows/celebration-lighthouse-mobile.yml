name: Celebration Mobile Lighthouse

on:
  push:
    branches:
      - perf/mobile-hero-marquee
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: celebration-site
    steps:
      - uses: actions/checkout@v5

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: celebration-site/package-lock.json

      - name: Install
        run: npm ci

      - name: Dependency audit
        run: npm audit --omit=dev

      - name: Source audit
        run: npm run audit

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Start production server
        run: |
          npm start -- -H 127.0.0.1 -p 3099 > /tmp/celebration-lighthouse-server.log 2>&1 &
          echo $! > /tmp/celebration-lighthouse-server.pid
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:3099/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/celebration-lighthouse-server.log
          exit 1

      - name: Lighthouse mobile median audit
        run: |
          for run in 1 2 3; do
            npx --yes lighthouse@12.8.2 http://127.0.0.1:3099/ \
              --quiet \
              --chrome-flags="--headless --no-sandbox --disable-gpu" \
              --only-categories=performance,accessibility,best-practices,seo \
              --form-factor=mobile \
              --screenEmulation.mobile=true \
              --screenEmulation.width=390 \
              --screenEmulation.height=844 \
              --screenEmulation.deviceScaleFactor=2 \
              --throttling-method=simulate \
              --output=json \
              --output-path="/tmp/celebration-lighthouse-$run.json"
          done

          node <<'NODE'
          const fs = require('fs')
          const reports = [1,2,3].map(n => JSON.parse(fs.readFileSync(`/tmp/celebration-lighthouse-${n}.json`, 'utf8')))
          const score = (report, key) => Math.round((report.categories[key]?.score || 0) * 100)
          const numeric = (report, key) => Number(report.audits[key]?.numericValue || 0)
          const median = values => [...values].sort((a,b)=>a-b)[Math.floor(values.length/2)]
          const perRun = reports.map((report, index) => ({
            run: index + 1,
            performance: score(report, 'performance'),
            accessibility: score(report, 'accessibility'),
            bestPractices: score(report, 'best-practices'),
            seo: score(report, 'seo'),
            FCPms: Math.round(numeric(report, 'first-contentful-paint')),
            LCPms: Math.round(numeric(report, 'largest-contentful-paint')),
            TBTms: Math.round(numeric(report, 'total-blocking-time')),
            CLS: Number(numeric(report, 'cumulative-layout-shift').toFixed(4)),
            SpeedIndexMs: Math.round(numeric(report, 'speed-index'))
          }))
          const summary = {
            performance: median(perRun.map(x => x.performance)),
            accessibility: median(perRun.map(x => x.accessibility)),
            bestPractices: median(perRun.map(x => x.bestPractices)),
            FCPms: median(perRun.map(x => x.FCPms)),
            LCPms: median(perRun.map(x => x.LCPms)),
            TBTms: median(perRun.map(x => x.TBTms)),
            CLS: median(perRun.map(x => x.CLS)),
            SpeedIndexMs: median(perRun.map(x => x.SpeedIndexMs))
          }
          console.log('LIGHTHOUSE_RUNS=' + JSON.stringify(perRun))
          console.log('LIGHTHOUSE_MEDIAN=' + JSON.stringify(summary))
          if (summary.performance < 80) process.exitCode = 2
          if (summary.accessibility < 90 || summary.bestPractices < 90) process.exitCode = 3
          NODE

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: celebration-lighthouse-mobile
          path: /tmp/celebration-lighthouse-*.json
          if-no-files-found: warn
          retention-days: 1
