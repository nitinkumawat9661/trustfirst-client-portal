name: Validate Celebration Payment Confirmation

on:
  pull_request:
    paths:
      - "celebration-site/**"
      - ".github/workflows/validate-celebration-payment-confirmation.yml"

permissions:
  contents: read

jobs:
  validate-celebration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: celebration-site
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: celebration-site/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Run Celebration audit
        run: npm run audit

      - name: Typecheck
        run: npm run typecheck

      - name: Build production application
        run: npm run build
