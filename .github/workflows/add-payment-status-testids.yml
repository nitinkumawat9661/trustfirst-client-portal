name: Add payment status test IDs

on:
  push:
    branches:
      - fix/mangalam-stock-and-payment-status
    paths:
      - scripts/add-payment-status-testids.mjs
      - .github/workflows/add-payment-status-testids.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mangalam-stock-and-payment-status
          fetch-depth: 0
      - run: node scripts/add-payment-status-testids.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src
          git diff --cached --quiet && exit 0
          git commit -m "test: add stable payment status selectors"
          git push origin HEAD:fix/mangalam-stock-and-payment-status
