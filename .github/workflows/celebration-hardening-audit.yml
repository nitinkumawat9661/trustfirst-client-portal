name: Celebration Hardening Audit

on:
  push:
    branches:
      - feat/celebration-hardening-draft-publish
    paths:
      - ".github/workflows/celebration-hardening-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: celebration-site
    steps:
      - uses: actions/checkout@v5
      - run: npm ci
      - name: Production dependency audit
        run: |
          npm audit --omit=dev --json > /tmp/audit.json || true
          node - <<'NODE'
          const fs = require('fs')
          const v = JSON.parse(fs.readFileSync('/tmp/audit.json','utf8'))
          console.log(JSON.stringify({metadata:v.metadata,vulnerabilities:v.vulnerabilities}, null, 2))
          NODE
