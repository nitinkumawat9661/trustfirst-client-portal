name: One-time Security Dependency Refresh

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/security-dependency-refresh.yml"

permissions:
  contents: write

concurrency:
  group: security-dependency-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install current lock
        run: npm ci

      - name: Upgrade security-sensitive direct dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --workspace @trustfirst/web --save-exact next@16.3.8
          npm install --workspace @trustfirst/web --save-dev --save-exact eslint-config-next@16.3.8 vitest@4.1.11
          node <<'NODE'
          const fs = require("fs");
          const path = "package.json";
          const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
          pkg.overrides ||= {};
          pkg.overrides.next ||= {};
          pkg.overrides.next.sharp = "0.35.4";
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n");
          NODE
          npm install --package-lock-only
          npm audit fix --package-lock-only

      - name: Verify no critical audit finding remains
        run: |
          npm ci
          npm audit --audit-level=critical
          npm audit --omit=dev --audit-level=critical

      - name: Validate application
        run: |
          npm run db:generate
          npm run architecture:check
          npm run lint
          npm run typecheck
          npm test
          npm run build --workspace @trustfirst/web

      - name: Commit verified dependency refresh
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code --quiet && { echo "No dependency changes required."; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json apps/web/package.json
          git commit -m "Security: refresh vulnerable dependencies"
          git push origin HEAD:main
