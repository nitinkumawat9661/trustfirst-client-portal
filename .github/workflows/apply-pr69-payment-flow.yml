name: Apply PR 69 payment flow

on:
  issue_comment:
    types: [created]
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: apply-pr69-payment-flow
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event_name == 'schedule' ||
      (github.event.issue.pull_request &&
      github.event.issue.number == 69 &&
      github.event.comment.body == '/apply-post-bill-payment-flow')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: fix/post-bill-payment-accounting
          fetch-depth: 0

      - name: Detect pending codemod
        id: pending
        run: |
          if [ -f scripts/apply-post-bill-payment-flow.mjs ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.pending.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.pending.outputs.run == 'true'
        run: npm ci

      - name: Apply guarded source changes
        if: steps.pending.outputs.run == 'true'
        run: node scripts/apply-post-bill-payment-flow.mjs

      - name: Format changed files
        if: steps.pending.outputs.run == 'true'
        run: |
          npx prettier --write \
            apps/web/src/app/'(platform)'/admin/hardware/purchases/new/page.tsx \
            apps/web/src/components/hardware/bill-payment-choice-regression.test.ts \
            apps/web/src/components/hardware/bill-payment-confirmation-dialog.tsx \
            apps/web/src/components/hardware/estimate-bill-form.tsx \
            apps/web/src/components/hardware/hardware-trade-form.tsx \
            apps/web/src/components/hardware/quick-pos-form.tsx

      - name: Focused payment regression
        if: steps.pending.outputs.run == 'true'
        run: npm run test --workspace @trustfirst/web -- src/components/hardware/bill-payment-choice-regression.test.ts

      - name: Web lint
        if: steps.pending.outputs.run == 'true'
        run: npm run lint --workspace @trustfirst/web

      - name: Web typecheck
        if: steps.pending.outputs.run == 'true'
        run: npm run typecheck --workspace @trustfirst/web

      - name: Web production build
        if: steps.pending.outputs.run == 'true'
        run: npm run build --workspace @trustfirst/web

      - name: Diff safety
        if: steps.pending.outputs.run == 'true'
        run: git diff --check

      - name: Remove temporary branch automation
        if: steps.pending.outputs.run == 'true'
        run: rm scripts/apply-post-bill-payment-flow.mjs .github/workflows/apply-post-bill-payment-flow.yml

      - name: Commit validated implementation
        if: steps.pending.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: confirm payment after sales and purchase bills"
          git push origin HEAD:fix/post-bill-payment-accounting

      - name: Report success
        if: steps.pending.outputs.run == 'true' && success()
        run: gh pr comment 69 --repo "$GITHUB_REPOSITORY" --body "Payment confirmation implementation generated and validated successfully. Focused regression, lint, typecheck, production build and diff safety passed."

      - name: Report failure
        if: steps.pending.outputs.run == 'true' && failure()
        run: gh pr comment 69 --repo "$GITHUB_REPOSITORY" --body "Payment confirmation workflow failed. Inspect the latest **Apply PR 69 payment flow** job before merging; production was not changed."
