name: Celebration Next 16 Apply
on:
  push:
    branches: [feat/celebration-hardening-draft-publish]
    paths: [.github/workflows/celebration-next16-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/celebration-hardening-draft-publish
      - name: Update Next 16 async request APIs
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('celebration-site')
          p=root/'lib/security/admin-session.ts'
          s=p.read_text()
          s=s.replace('export function isAdminRequest() {\n  return validateAdminSession(cookies().get(ADMIN_COOKIE_NAME)?.value)\n}', 'export async function isAdminRequest() {\n  return validateAdminSession((await cookies()).get(ADMIN_COOKIE_NAME)?.value)\n}')
          p.write_text(s)
          p=root/'lib/security/customer-session.ts'
          s=p.read_text()
          s=s.replace('export function getCustomerSession() {\n  return validateCustomerSession(cookies().get(CUSTOMER_COOKIE_NAME)?.value)\n}', 'export async function getCustomerSession() {\n  return validateCustomerSession((await cookies()).get(CUSTOMER_COOKIE_NAME)?.value)\n}')
          p.write_text(s)
          for p in root.rglob('*'):
            if p.suffix not in {'.ts','.tsx'} or 'lib/security/admin-session.ts' in str(p) or 'lib/security/customer-session.ts' in str(p):
              continue
            s=p.read_text()
            n=s.replace('isAdminRequest()', 'await isAdminRequest()').replace('getCustomerSession()', 'await getCustomerSession()')
            if p.as_posix().endswith('app/admin/page.tsx'):
              n=n.replace('export default function AdminPage()', 'export default async function AdminPage()')
            if n!=s: p.write_text(n)
          PY
      - name: Upgrade production dependencies
        working-directory: celebration-site
        run: |
          npm install --save-exact next@16.3.5 react@19.3.0 react-dom@19.3.0 @aws-sdk/client-s3@3.1137.0 @aws-sdk/s3-request-presigner@3.1137.0 @types/react@19.3.0 @types/react-dom@19.3.0
          node - <<'NODE'
          const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); p.engines={...(p.engines||{}),node:">=20.9.0"}; fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')
          NODE
          npm install --package-lock-only
          npm audit --omit=dev
          npm run audit
          npm run typecheck
          npm run build
      - name: Commit validated hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add celebration-site
          git diff --cached --quiet && exit 0
          git commit -m "chore(celebration): upgrade secure runtime baseline"
          git push origin HEAD:feat/celebration-hardening-draft-publish
