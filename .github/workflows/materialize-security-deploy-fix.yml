name: Materialize Security Deploy Fix

# One-time branch-only workflow. It deletes itself after materializing the patch.
on:
  push:
    branches:
      - agent/mangalam-security-deploy-fix
    paths:
      - ".github/workflows/materialize-security-deploy-fix.yml"
      - "scripts/materialize-security-deploy-fix.mjs"

permissions:
  contents: write

concurrency:
  group: materialize-security-deploy-fix
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out security deploy branch
        uses: actions/checkout@v4
        with:
          ref: agent/mangalam-security-deploy-fix
          fetch-depth: 0

      - name: Apply guarded deploy patch
        run: node scripts/materialize-security-deploy-fix.mjs

      - name: Validate deployment script
        run: bash -n scripts/deploy-production-ci.sh

      - name: Remove one-time tooling
        run: rm scripts/materialize-security-deploy-fix.mjs .github/workflows/materialize-security-deploy-fix.yml

      - name: Commit materialized source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/deploy-production-ci.sh .github/workflows/deploy-mangalam-production.yml scripts/materialize-security-deploy-fix.mjs .github/workflows/materialize-security-deploy-fix.yml
          git diff --cached --check
          git commit -m "security: provision canonical auth settings during deployment"
          git push origin HEAD:agent/mangalam-security-deploy-fix
