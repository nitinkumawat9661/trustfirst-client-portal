name: Celebration Next Security Fix

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/celebration-next-security-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: Upgrade Celebration Next.js to patched release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: celebration-site/package-lock.json

      - name: Generate and verify patched dependency tree
        working-directory: celebration-site
        shell: bash
        run: |
          set -euo pipefail
          npm install --save-exact next@16.3.8
          npm audit --omit=dev --audit-level=critical
          npm run audit
          npm run typecheck

      - name: Commit generated dependency update to patch branch
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="fix/celebration-next-security-16-3-8"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add celebration-site/package.json celebration-site/package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency update required."
            exit 0
          fi
          git commit -m "chore: patch Celebration Next.js security advisory"
          git push --force origin "HEAD:$BRANCH"
