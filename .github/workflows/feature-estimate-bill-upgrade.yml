name: Finalize Estimate Bill Upgrade

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/feature-estimate-bill-upgrade.yml"
      - "scripts/apply_estimate_bill_upgrade.py"
      - "scripts/run-estimate-bill-upgrade.mjs"
      - "package.json"

permissions:
  actions: write
  contents: write

concurrency:
  group: finalize-estimate-bill-upgrade
  cancel-in-progress: false

jobs:
  materialize-clean-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out merged main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Materialize validated feature source
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint materialized source
        run: npm run lint

      - name: Typecheck materialized source
        run: npm run typecheck

      - name: Test materialized source
        run: npm test

      - name: Build materialized source
        run: npm run build --workspace @trustfirst/web

      - name: Remove temporary materializer
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const packageJson = JSON.parse(fs.readFileSync("package.json", "utf8"));
          delete packageJson.scripts.postinstall;
          delete packageJson.scripts.prebuild;
          fs.writeFileSync("package.json", `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE
          rm -f scripts/apply_estimate_bill_upgrade.py
          rm -f scripts/run-estimate-bill-upgrade.mjs
          rm -f .github/workflows/feature-estimate-bill-upgrade.yml
          git diff --check

      - name: Commit clean feature source
        id: clean_commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: materialize Estimate Bill upgrade source"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Dispatch guarded clean-SHA deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/deploy-mangalam-production.yml/dispatches" \
            --data '{"ref":"main"}'
          echo "CLEAN_SHA=${{ steps.clean_commit.outputs.sha }}"
          echo "CLEAN_SOURCE_DEPLOYMENT_DISPATCHED"
