name: Apply PR 72 Guarded Repairs

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'fix/mangalam-save-lock-search-debounce'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Apply exact source repairs
        run: node scripts/fix-pr72-lint.mjs

      - name: Verify lint
        run: npm run lint

      - name: Commit repaired source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/components/hardware/hardware-product-combobox.tsx apps/web/src/components/hardware/bill-payment-confirmation-dialog.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix: make billing debounce lint-safe'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
