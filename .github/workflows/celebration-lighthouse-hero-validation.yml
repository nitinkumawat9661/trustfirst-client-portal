name: Celebration Lighthouse Hero Validation

on:
  push:
    branches:
      - validate/celebration-hero-perf
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: celebration-site
    steps:
      - uses: actions/checkout@v5

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: celebration-site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev

      - name: Celebration source audit
        run: npm run audit

      - name: TypeScript check
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Start candidate production server
        run: |
          nohup npm run start -- -H 127.0.0.1 -p 3055 > /tmp/celebration-next.log 2>&1 &
          echo $! > /tmp/celebration-next.pid
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:3055/ >/dev/null; then
              echo "Candidate server ready"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/celebration-next.log
          exit 1

      - name: Install Lighthouse
        run: npm install --no-save --no-package-lock lighthouse@12.8.2

      - name: Resolve Chrome
        id: chrome
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "Chrome executable not found"
            exit 1
          fi
          echo "path=$CHROME" >> "$GITHUB_OUTPUT"
          echo "Using $CHROME"

      - name: Lighthouse live baseline
        run: |
          npx lighthouse https://shopcelebration.in \
            --quiet \
            --chrome-path="${{ steps.chrome.outputs.path }}" \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --preset=perf \
            --form-factor=mobile \
            --screenEmulation.mobile=true \
            --output=json \
            --output-path=/tmp/lighthouse-live.json

      - name: Lighthouse candidate mobile
        run: |
          npx lighthouse http://127.0.0.1:3055 \
            --quiet \
            --chrome-path="${{ steps.chrome.outputs.path }}" \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --preset=perf \
            --form-factor=mobile \
            --screenEmulation.mobile=true \
            --output=json \
            --output-path=/tmp/lighthouse-candidate.json

      - name: Compare Lighthouse metrics
        run: |
          node <<'NODE'
          const fs = require('fs')
          const live = JSON.parse(fs.readFileSync('/tmp/lighthouse-live.json','utf8'))
          const next = JSON.parse(fs.readFileSync('/tmp/lighthouse-candidate.json','utf8'))
          const score = r => Math.round((r.categories.performance.score || 0) * 100)
          const metric = (r, id) => r.audits[id]?.displayValue || 'n/a'
          const data = {
            live: {
              performance: score(live),
              fcp: metric(live,'first-contentful-paint'),
              lcp: metric(live,'largest-contentful-paint'),
              tbt: metric(live,'total-blocking-time'),
              cls: metric(live,'cumulative-layout-shift'),
              speedIndex: metric(live,'speed-index')
            },
            candidate: {
              performance: score(next),
              fcp: metric(next,'first-contentful-paint'),
              lcp: metric(next,'largest-contentful-paint'),
              tbt: metric(next,'total-blocking-time'),
              cls: metric(next,'cumulative-layout-shift'),
              speedIndex: metric(next,'speed-index')
            }
          }
          console.log(JSON.stringify(data,null,2))
          fs.writeFileSync('/tmp/lighthouse-summary.json', JSON.stringify(data,null,2))
          if (data.candidate.performance < 80) {
            throw new Error(`Candidate mobile Lighthouse performance ${data.candidate.performance} is below 80`)
          }
          if (data.candidate.performance + 4 < data.live.performance) {
            throw new Error(`Candidate performance regressed too far: live ${data.live.performance}, candidate ${data.candidate.performance}`)
          }
          NODE

      - name: Mobile hero visual smoke
        run: |
          mkdir -p /tmp/celebration-hero-evidence
          "${{ steps.chrome.outputs.path }}" \
            --headless --no-sandbox --disable-gpu --hide-scrollbars \
            --window-size=390,844 --force-device-scale-factor=1 \
            --screenshot=/tmp/celebration-hero-evidence/hero-mobile.png \
            http://127.0.0.1:3055/
          cp /tmp/lighthouse-summary.json /tmp/celebration-hero-evidence/
          cp /tmp/lighthouse-live.json /tmp/celebration-hero-evidence/
          cp /tmp/lighthouse-candidate.json /tmp/celebration-hero-evidence/
          test -s /tmp/celebration-hero-evidence/hero-mobile.png

      - name: Verify marquee and hero markup
        run: |
          HTML="$(curl -fsS http://127.0.0.1:3055/)"
          echo "$HTML" | grep -q 'trustStripTrack'
          echo "$HTML" | grep -q 'heroItalic'
          echo "$HTML" | grep -q 'heroVisual'

      - name: Upload Lighthouse and visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: celebration-lighthouse-hero-evidence
          path: /tmp/celebration-hero-evidence
          if-no-files-found: error
          retention-days: 1
