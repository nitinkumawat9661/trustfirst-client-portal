name: Rotate Production Auth Secret

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/rotate-production-auth-secret.yml"

permissions:
  contents: read

concurrency:
  group: trustfirst-production-auth-secret-rotation
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      PM2_APP_NAME: ${{ vars.PM2_APP_NAME }}
      PRODUCTION_PORT: ${{ vars.PRODUCTION_PORT }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
      EXPECTED_DEPLOYED_SHA: 9b60de2eeb1d760087b1d8cf0eff3763143eaa5c

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate rotation configuration
        shell: bash
        run: |
          set -euo pipefail
          required=(
            VPS_HOST VPS_PORT VPS_USER VPS_SSH_PRIVATE_KEY VPS_KNOWN_HOSTS
            DEPLOY_PATH PM2_APP_NAME PRODUCTION_PORT PRODUCTION_URL PUBLIC_URL
            EXPECTED_DEPLOYED_SHA
          )
          for name in "${required[@]}"; do
            [ -n "${!name:-}" ] || {
              echo "Missing production rotation value: $name" >&2
              exit 1
            }
          done
          [ "$DEPLOY_PATH" = "/var/www/trustfirst-client-portal" ]
          [ "$PM2_APP_NAME" = "trustfirst-client-portal" ]
          [ "$PRODUCTION_PORT" = "3010" ]
          [ "$PRODUCTION_PORT" != "3000" ]
          [ "$PRODUCTION_URL" = "https://app.mangalamsanitary.in" ]
          [ "$PUBLIC_URL" = "https://mangalamsanitary.in" ]

      - name: Configure verified SSH access
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/trustfirst_rotate"
          printf '%s\n' "$VPS_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/trustfirst_rotate" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/trustfirst_rotate" >/dev/null
          ssh-keygen -F "$VPS_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null

      - name: Rotate secret with rollback and live verification
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -p "$VPS_PORT" \
            -i "$HOME/.ssh/trustfirst_rotate" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            bash -s -- \
              "$EXPECTED_DEPLOYED_SHA" \
              "$DEPLOY_PATH" \
              "$PM2_APP_NAME" \
              "$PRODUCTION_PORT" \
              "$PRODUCTION_URL" \
              "$PUBLIC_URL" <<'REMOTE'
          set -Eeuo pipefail

          EXPECTED_SHA="$1"
          APP_DIR="$2"
          PM2_PROCESS="$3"
          PROD_PORT="$4"
          ERP_URL="$5"
          PUBLIC_URL="$6"
          ENV_FILE="/etc/trustfirst-client-portal.env"
          BACKUP_FILE="/tmp/trustfirst-auth-secret-backup.$$"
          ROTATING=0
          ORIGINAL_UID=""
          ORIGINAL_GID=""
          ORIGINAL_MODE=""
          CAFE_BEFORE=""

          log() {
            printf '[auth-secret-rotation] %s\n' "$*"
          }

          canonical_health() {
            curl --silent --show-error --fail --max-time 5 \
              --header "Host: app.mangalamsanitary.in" \
              --header "X-Forwarded-Host: app.mangalamsanitary.in" \
              --header "X-Forwarded-Proto: https" \
              --header "X-Forwarded-Port: 443" \
              "http://127.0.0.1:${PROD_PORT}/api/auth/session" >/dev/null
          }

          start_application() {
            cd "$APP_DIR"
            set -a
            # shellcheck disable=SC1090
            . "$ENV_FILE"
            set +a
            PORT="$PROD_PORT" pm2 start npm \
              --name "$PM2_PROCESS" \
              --cwd "$APP_DIR" \
              --time \
              --update-env \
              -- run start --workspace @trustfirst/web -- --hostname 127.0.0.1
          }

          restart_application() {
            pm2 delete "$PM2_PROCESS" >/dev/null 2>&1 || true
            start_application
          }

          wait_for_health() {
            local ready=0
            for attempt in $(seq 1 45); do
              if canonical_health >/dev/null 2>&1; then
                ready=1
                break
              fi
              sleep 1
            done
            [ "$ready" = "1" ]
          }

          restore_previous_secret() {
            local status="$1"
            local line="$2"
            trap - ERR
            set +e
            log "Rotation verification failed at line $line. Restoring previous secret."
            if [ "$ROTATING" = "1" ] && sudo -n test -f "$BACKUP_FILE"; then
              sudo -n install \
                -o "$ORIGINAL_UID" \
                -g "$ORIGINAL_GID" \
                -m "$ORIGINAL_MODE" \
                "$BACKUP_FILE" \
                "$ENV_FILE"
              restart_application
              if wait_for_health && \
                 curl --silent --show-error --fail --max-time 15 "$ERP_URL/api/auth/session" >/dev/null && \
                 curl --silent --show-error --fail --max-time 15 "$PUBLIC_URL" >/dev/null; then
                log "Previous secret and runtime restored successfully."
              else
                log "Rollback attempted, but runtime verification failed."
              fi
            fi
            sudo -n rm -f "$BACKUP_FILE" >/dev/null 2>&1 || true
            exit "$status"
          }

          trap 'restore_previous_secret $? $LINENO' ERR

          [ "$(id -un)" != "root" ]
          [ "$APP_DIR" = "/var/www/trustfirst-client-portal" ]
          [ "$PM2_PROCESS" = "trustfirst-client-portal" ]
          [ "$PROD_PORT" = "3010" ]
          [ "$PROD_PORT" != "3000" ]
          [ "$ERP_URL" = "https://app.mangalamsanitary.in" ]
          [ "$PUBLIC_URL" = "https://mangalamsanitary.in" ]
          [ -r "$ENV_FILE" ]
          [ -f "$APP_DIR/.trustfirst-deployed-commit" ]
          [ "$(cat "$APP_DIR/.trustfirst-deployed-commit")" = "$EXPECTED_SHA" ]
          command -v sudo >/dev/null
          sudo -n true
          command -v openssl >/dev/null
          command -v pm2 >/dev/null
          command -v curl >/dev/null
          pm2 describe "$PM2_PROCESS" >/dev/null
          canonical_health
          curl --silent --show-error --fail --max-time 15 "$ERP_URL/api/auth/session" >/dev/null
          curl --silent --show-error --fail --max-time 15 "$PUBLIC_URL" >/dev/null

          SECRET_COUNT="$(awk -F= '$1 == "AUTH_SECRET" { count++ } END { print count + 0 }' "$ENV_FILE")"
          [ "$SECRET_COUNT" = "1" ]
          CURRENT_SECRET_LENGTH="$(awk -F= '$1 == "AUTH_SECRET" { print length(substr($0, index($0, "=") + 1)) }' "$ENV_FILE")"
          [ "$CURRENT_SECRET_LENGTH" -ge 32 ]

          ORIGINAL_UID="$(stat -c '%u' "$ENV_FILE")"
          ORIGINAL_GID="$(stat -c '%g' "$ENV_FILE")"
          ORIGINAL_MODE="$(stat -c '%a' "$ENV_FILE")"
          CAFE_BEFORE="$(ss -ltnp 2>/dev/null | grep -E '[:.]3000[[:space:]]' || true)"

          sudo -n install -o root -g root -m 600 "$ENV_FILE" "$BACKUP_FILE"
          ROTATING=1

          sudo -n bash -s -- "$ENV_FILE" "$ORIGINAL_UID" "$ORIGINAL_GID" "$ORIGINAL_MODE" <<'ROOT'
          set -Eeuo pipefail
          ENV_FILE="$1"
          OWNER_UID="$2"
          OWNER_GID="$3"
          FILE_MODE="$4"
          TEMP_FILE="$(mktemp /tmp/trustfirst-auth-secret-new.XXXXXX)"
          trap 'rm -f "$TEMP_FILE"' EXIT
          NEW_SECRET="$(openssl rand -hex 48)"
          [ "${#NEW_SECRET}" -eq 96 ]
          SECRET_COUNT=0
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              AUTH_SECRET=*)
                SECRET_COUNT=$((SECRET_COUNT + 1))
                printf 'AUTH_SECRET=%s\n' "$NEW_SECRET" >> "$TEMP_FILE"
                ;;
              *)
                printf '%s\n' "$line" >> "$TEMP_FILE"
                ;;
            esac
          done < "$ENV_FILE"
          [ "$SECRET_COUNT" -eq 1 ]
          chmod 600 "$TEMP_FILE"
          install -o "$OWNER_UID" -g "$OWNER_GID" -m "$FILE_MODE" "$TEMP_FILE" "$ENV_FILE"
          unset NEW_SECRET
          ROOT

          NEW_SECRET_LENGTH="$(awk -F= '$1 == "AUTH_SECRET" { print length(substr($0, index($0, "=") + 1)) }' "$ENV_FILE")"
          [ "$NEW_SECRET_LENGTH" -eq 96 ]
          [ "$(awk -F= '$1 == "AUTH_SECRET" { count++ } END { print count + 0 }' "$ENV_FILE")" = "1" ]

          restart_application
          wait_for_health
          curl --silent --show-error --fail --max-time 15 "$ERP_URL/api/auth/session" >/dev/null
          curl --silent --show-error --fail --max-time 15 "$PUBLIC_URL" >/dev/null
          [ "$(cat "$APP_DIR/.trustfirst-deployed-commit")" = "$EXPECTED_SHA" ]
          CAFE_AFTER="$(ss -ltnp 2>/dev/null | grep -E '[:.]3000[[:space:]]' || true)"
          [ "$CAFE_AFTER" = "$CAFE_BEFORE" ]

          sudo -n rm -f "$BACKUP_FILE"
          ROTATING=0
          trap - ERR
          log "AUTH_SECRET rotated to 96 characters without exposing its value."
          log "Existing sessions were invalidated by design."
          log "ERP/public health passed, deployed SHA unchanged, CafeLuxe untouched."
          REMOTE
