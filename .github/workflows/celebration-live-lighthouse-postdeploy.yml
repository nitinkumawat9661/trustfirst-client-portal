name: Celebration Live Lighthouse Postdeploy

on:
  push:
    branches:
      - validate/celebration-hero-perf

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Lighthouse
        run: npm install --no-save --no-package-lock lighthouse@12.8.2

      - name: Resolve Chrome
        id: chrome
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          echo "path=$CHROME" >> "$GITHUB_OUTPUT"

      - name: Run live mobile Lighthouse three times
        run: |
          mkdir -p /tmp/celebration-live-lighthouse
          for i in 1 2 3; do
            npx lighthouse https://shopcelebration.in \
              --quiet \
              --chrome-path="${{ steps.chrome.outputs.path }}" \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
              --preset=perf \
              --form-factor=mobile \
              --screenEmulation.mobile=true \
              --output=json \
              --output-path="/tmp/celebration-live-lighthouse/run-$i.json"
          done

      - name: Calculate median live result
        run: |
          node <<'NODE'
          const fs = require('fs')
          const reports = [1,2,3].map(i => JSON.parse(fs.readFileSync(`/tmp/celebration-live-lighthouse/run-${i}.json`, 'utf8')))
          const score = r => Math.round((r.categories.performance.score || 0) * 100)
          const numeric = (r, id) => r.audits[id]?.numericValue ?? null
          const display = (r, id) => r.audits[id]?.displayValue || 'n/a'
          const sorted = reports.map((r, i) => ({r, i: i+1, score: score(r)})).sort((a,b) => a.score - b.score)
          const median = sorted[1]
          const summary = {
            runs: reports.map((r, i) => ({run:i+1, performance:score(r)})),
            median: {
              run: median.i,
              performance: median.score,
              fcp: display(median.r,'first-contentful-paint'),
              lcp: display(median.r,'largest-contentful-paint'),
              tbt: display(median.r,'total-blocking-time'),
              cls: display(median.r,'cumulative-layout-shift'),
              speedIndex: display(median.r,'speed-index'),
              fcpMs: numeric(median.r,'first-contentful-paint'),
              lcpMs: numeric(median.r,'largest-contentful-paint'),
              tbtMs: numeric(median.r,'total-blocking-time')
            }
          }
          console.log(JSON.stringify(summary,null,2))
          fs.writeFileSync('/tmp/celebration-live-lighthouse/summary.json', JSON.stringify(summary,null,2))
          if (median.score < 80) throw new Error(`Median live Lighthouse performance ${median.score} is below 80`)
          NODE

      - name: Capture live mobile hero
        run: |
          "${{ steps.chrome.outputs.path }}" \
            --headless --no-sandbox --disable-gpu --hide-scrollbars \
            --window-size=390,844 --force-device-scale-factor=1 \
            --virtual-time-budget=1800 \
            --screenshot=/tmp/celebration-live-lighthouse/live-hero-mobile.png \
            https://shopcelebration.in/
          test -s /tmp/celebration-live-lighthouse/live-hero-mobile.png

      - name: Verify live health and new markup
        run: |
          curl -fsS https://shopcelebration.in/api/health >/dev/null
          HTML="$(curl -fsS https://shopcelebration.in/)"
          echo "$HTML" | grep -q 'trustStripTrack'
          echo "$HTML" | grep -q 'heroItalic'
          echo "$HTML" | grep -q 'heroImmediate'

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: celebration-live-lighthouse-postdeploy
          path: /tmp/celebration-live-lighthouse
          if-no-files-found: error
          retention-days: 1
