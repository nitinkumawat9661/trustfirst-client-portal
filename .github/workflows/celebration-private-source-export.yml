name: Celebration Private Source Export

on:
  push:
    branches: [main]
    paths: [.github/workflows/celebration-private-source-export.yml]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Verify export contains no runtime secrets
        shell: bash
        run: |
          set -euo pipefail
          test -f celebration-site/package.json
          test ! -e celebration-site/.env
          test ! -e celebration-site/.env.production
          ! find celebration-site -maxdepth 1 -type f -name '.env.*' | grep -q .
      - name: Upload committed Celebration source
        uses: actions/upload-artifact@v4
        with:
          name: celebration-private-source
          path: celebration-site
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
