name: Finalize customer creation source

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: finalize-customer-creation-source
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Detect temporary materializer
        id: detect
        shell: bash
        run: |
          if [ -f scripts/apply-fast-bill-customer-fix.py ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Materialize readable source
        if: steps.detect.outputs.needed == 'true'
        run: npm ci
      - name: Remove temporary hooks
        if: steps.detect.outputs.needed == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('package.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          if data.get('scripts', {}).get('postinstall') == 'python3 scripts/apply-fast-bill-customer-fix.py':
              del data['scripts']['postinstall']
          path.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          PY
          rm scripts/apply-fast-bill-customer-fix.py
          rm .github/workflows/finalize-customer-creation-source.yml
      - name: Validate clean source
        if: steps.detect.outputs.needed == 'true'
        shell: bash
        run: |
          npm run db:generate
          npm run lint
          npm run typecheck
          npm test
          npm run build --workspace @trustfirst/web
          test ! -e scripts/apply-fast-bill-customer-fix.py
          git diff --check
      - name: Commit clean source
        if: steps.detect.outputs.needed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json apps/web/src/components/hardware/quick-pos-form.tsx apps/web/src/server/hardware/customer-creation-flow.test.ts scripts/apply-fast-bill-customer-fix.py .github/workflows/finalize-customer-creation-source.yml
          git commit -m "fix: persist reliable Fast Bill customer creation"
          git push origin HEAD:main
