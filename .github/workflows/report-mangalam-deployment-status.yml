name: Report Mangalam Deployment Status

on:
  workflow_run:
    workflows:
      - Deploy Mangalam ERP Production
    types:
      - requested
      - in_progress
      - completed

permissions:
  statuses: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Publish deployment commit status
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          EVENT_ACTION: ${{ github.event.action }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        shell: bash
        run: |
          set -euo pipefail

          state="pending"
          description="Mangalam production deployment is running"

          if [ "$EVENT_ACTION" = "completed" ]; then
            if [ "$CONCLUSION" = "success" ]; then
              state="success"
              description="Mangalam production deployment succeeded"
            else
              state="failure"
              description="Mangalam production deployment failed: ${CONCLUSION:-unknown}"
            fi
          fi

          jq -n \
            --arg state "$state" \
            --arg target_url "$RUN_URL" \
            --arg description "$description" \
            --arg context "Mangalam Production Deployment" \
            '{state: $state, target_url: $target_url, description: $description, context: $context}' \
            > status.json

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$HEAD_SHA" \
            --data @status.json
