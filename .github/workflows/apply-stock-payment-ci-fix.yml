name: Apply stock payment CI fix

on:
  push:
    branches:
      - fix/mangalam-stock-and-payment-status
    paths:
      - scripts/apply-stock-payment-ci-fix.mjs
      - .github/workflows/apply-stock-payment-ci-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/mangalam-stock-and-payment-status
          fetch-depth: 0
      - name: Apply guarded compatibility fixes
        run: node scripts/apply-stock-payment-ci-fix.mjs
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src
          git diff --cached --quiet && exit 0
          git commit -m "test: align stock and payment regressions"
          git push origin HEAD:fix/mangalam-stock-and-payment-status
