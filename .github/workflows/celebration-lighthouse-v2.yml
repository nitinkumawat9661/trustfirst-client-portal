name: Celebration Lighthouse V2

on:
  push:
    branches:
      - validate/lighthouse-live-v2
    paths:
      - ".github/workflows/celebration-lighthouse-v2.yml"
      - "celebration-site/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: celebration-site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: celebration-site/package-lock.json
      - name: Validate source
        run: |
          npm ci
          npm audit --omit=dev
          npm run audit
          npm run typecheck
          npm run build
      - name: Start and warm production server
        run: |
          npm start -- -H 127.0.0.1 -p 3099 > /tmp/celebration-v2-server.log 2>&1 &
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:3099/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3099/ >/dev/null
          curl -fsS http://127.0.0.1:3099/ >/dev/null
      - name: Run three mobile Lighthouse samples
        run: |
          for n in 1 2 3; do
            npx --yes lighthouse@12.8.2 http://127.0.0.1:3099/ \
              --quiet \
              --chrome-flags="--headless --no-sandbox --disable-gpu" \
              --only-categories=performance,accessibility,best-practices,seo \
              --form-factor=mobile \
              --screenEmulation.mobile=true \
              --screenEmulation.width=390 \
              --screenEmulation.height=844 \
              --screenEmulation.deviceScaleFactor=2 \
              --throttling-method=simulate \
              --output=json \
              --output-path="/tmp/lighthouse-v2-$n.json"
          done
      - name: Summarize median
        run: |
          node <<'NODE'
          const fs = require('fs')
          const reports = [1,2,3].map(n => JSON.parse(fs.readFileSync(`/tmp/lighthouse-v2-${n}.json`, 'utf8')))
          const score = (r,k) => Math.round((r.categories[k]?.score || 0) * 100)
          const num = (r,k) => r.audits[k]?.numericValue || 0
          const sorted = values => [...values].sort((a,b)=>a-b)
          const median = values => sorted(values)[1]
          const samples = reports.map(r => ({
            performance: score(r,'performance'),
            accessibility: score(r,'accessibility'),
            bestPractices: score(r,'best-practices'),
            seo: score(r,'seo'),
            FCP: Math.round(num(r,'first-contentful-paint')),
            LCP: Math.round(num(r,'largest-contentful-paint')),
            TBT: Math.round(num(r,'total-blocking-time')),
            CLS: Number(num(r,'cumulative-layout-shift').toFixed(3)),
            SpeedIndex: Math.round(num(r,'speed-index')),
            serverResponse: Math.round(num(r,'server-response-time'))
          }))
          const summary = {
            performance: median(samples.map(x=>x.performance)),
            accessibility: median(samples.map(x=>x.accessibility)),
            bestPractices: median(samples.map(x=>x.bestPractices)),
            seo: median(samples.map(x=>x.seo)),
            FCPms: median(samples.map(x=>x.FCP)),
            LCPms: median(samples.map(x=>x.LCP)),
            TBTms: median(samples.map(x=>x.TBT)),
            CLS: median(samples.map(x=>x.CLS)),
            SpeedIndexMs: median(samples.map(x=>x.SpeedIndex)),
            serverResponseMs: median(samples.map(x=>x.serverResponse))
          }
          console.log('LIGHTHOUSE_V2_SAMPLES=' + JSON.stringify(samples))
          console.log('LIGHTHOUSE_V2_MEDIAN=' + JSON.stringify(summary))
          if (summary.performance < 80) process.exitCode = 2
          if (summary.accessibility < 95 || summary.bestPractices < 90 || summary.seo < 95) process.exitCode = 3
          NODE
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: celebration-lighthouse-v2
          path: /tmp/lighthouse-v2-*.json
          if-no-files-found: warn
          retention-days: 1
