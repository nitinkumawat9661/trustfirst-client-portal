name: Validate Celebration Hardening
on:
  push:
    branches: [feat/celebration-hardening-draft-publish]
    paths:
      - "celebration-site/**"
      - ".github/workflows/validate-celebration-hardening.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: celebration_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d celebration_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: celebration-site
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/celebration_ci
      DATABASE_SSL_MODE: disable
    steps:
      - uses: actions/checkout@v5
      - run: node --version
      - run: npm ci
      - name: Production vulnerability gate
        run: npm audit --omit=dev
      - name: Source and domain audit
        run: npm run audit
      - name: Typecheck
        run: npm run typecheck
      - name: Apply all migrations
        run: npm run db:migrate
      - name: Verify migration idempotency
        run: npm run db:migrate
      - name: Verify catalog draft schema
        run: |
          node - <<'NODE'
          const {Client}=require('pg');
          const c=new Client({connectionString:process.env.DATABASE_URL});
          (async()=>{await c.connect();
            const t=await c.query("select to_regclass('public.catalog_drafts') as draft");
            if(!t.rows[0]?.draft) throw new Error('catalog_drafts missing');
            const m=await c.query("select 1 from schema_migrations where name='006_catalog_draft_publish.sql'");
            if(m.rowCount!==1) throw new Error('migration 006 missing');
            await c.end(); console.log('draft schema verified');
          })().catch(async e=>{console.error(e);try{await c.end()}catch{}process.exit(1)});
          NODE
      - name: Production build
        run: npm run build
