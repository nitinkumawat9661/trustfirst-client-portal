name: Finalize Recommendation Hardening

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: finalize-recommendation-hardening
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Detect temporary hardening patch
        id: detect
        shell: bash
        run: |
          if [ -f scripts/apply-recommendation-hardening.py ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Use Node.js 22
        if: steps.detect.outputs.needed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Materialize readable source
        if: steps.detect.outputs.needed == 'true'
        run: npm ci

      - name: Remove temporary hook and finalizer
        if: steps.detect.outputs.needed == 'true'
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (packageJson.scripts?.postinstall === 'python3 scripts/apply-recommendation-hardening.py') {
            delete packageJson.scripts.postinstall;
          }
          fs.writeFileSync('package.json', `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE
          rm scripts/apply-recommendation-hardening.py
          rm .github/workflows/finalize-recommendation-hardening.yml

      - name: Validate clean readable source
        if: steps.detect.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run db:generate
          npm run lint
          npm run typecheck
          npm test
          npm run build --workspace @trustfirst/web
          bash -n scripts/vps-mangalam-daily-backup.sh
          test ! -e scripts/apply-recommendation-hardening.py
          ! grep -q 'apply-recommendation-hardening.py' package.json
          git diff --check

      - name: Commit clean source
        if: steps.detect.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: persist staging E2E party roles and backup hardening"
          git push origin HEAD:main
