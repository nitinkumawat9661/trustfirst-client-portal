name: Mangalam Canary Read-only Diagnostics

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/mangalam-canary-readonly-diagnostics.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      PM2_APP_NAME: ${{ vars.PM2_APP_NAME }}
      CANARY_PORT: ${{ vars.CANARY_PORT }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure verified SSH access
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/trustfirst_diag"
          printf '%s\n' "$VPS_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/trustfirst_diag" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/trustfirst_diag" >/dev/null
          ssh-keygen -F "$VPS_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null

      - name: Collect redacted canary diagnostics
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -p "$VPS_PORT" \
            -i "$HOME/.ssh/trustfirst_diag" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            bash -s -- "$PM2_APP_NAME" "$CANARY_PORT" <<'REMOTE'
          set -euo pipefail
          PM2_PROCESS="$1"
          CANARY_PORT="$2"
          CANARY_NAME="${PM2_PROCESS}-canary"

          CANARY_CWD="$(pm2 jlist | node -e '
            const fs = require("fs");
            const target = process.argv[1];
            const list = JSON.parse(fs.readFileSync(0, "utf8"));
            const item = list.find((entry) => String(entry.name || entry.pm2_env?.name || "") === target);
            process.stdout.write(String(item?.pm2_env?.pm_cwd || ""));
          ' "$CANARY_NAME")"

          echo "=== PM2 redacted snapshot ==="
          pm2 jlist | node -e '
            const fs = require("fs");
            const list = JSON.parse(fs.readFileSync(0, "utf8"));
            for (const item of list) {
              const env = item.pm2_env || {};
              const name = String(item.name || env.name || "");
              if (!/^trustfirst/i.test(name)) continue;
              console.log(JSON.stringify({
                name,
                status: env.status,
                pid: item.pid,
                restarts: env.restart_time,
                cwd: env.pm_cwd,
                script: env.pm_exec_path,
                args: env.args,
              }));
            }
          '

          echo "=== Listener snapshot ==="
          ss -ltnp 2>/dev/null | grep -E "[:.]${CANARY_PORT}[[:space:]]" || true

          echo "=== Direct canary HTTP response ==="
          curl --silent --show-error --include --max-time 5 \
            "http://127.0.0.1:${CANARY_PORT}/api/auth/session" || true

          echo "=== Canonical-host canary HTTP response ==="
          curl --silent --show-error --include --max-time 5 \
            --header "Host: app.mangalamsanitary.in" \
            "http://127.0.0.1:${CANARY_PORT}/api/auth/session" || true

          echo "=== Active runtime metadata ==="
          echo "canary_cwd=$CANARY_CWD"
          if [ -n "$CANARY_CWD" ] && [ -d "$CANARY_CWD" ]; then
            stat -c 'mode=%a owner=%U group=%G path=%n' "$CANARY_CWD/apps/web/.env.production.local" 2>/dev/null || true
            awk -F= '/^[A-Z0-9_]+=/{print "env_key=" $1}' "$CANARY_CWD/apps/web/.env.production.local" 2>/dev/null || true

            echo "node_version=$(node --version)"
            echo "npm_version=$(npm --version)"
            echo "npm_registry=$(cd "$CANARY_CWD" && npm config get registry)"

            cd "$CANARY_CWD"
            node -e '
              const pkg = require("./node_modules/next/package.json");
              console.log(JSON.stringify({
                nextVersion: pkg.version,
                nextResolvedPath: require.resolve("next/package.json"),
                packageFilesField: pkg.files || null,
              }));
            '

            echo "=== Required Next runtime files ==="
            for file in \
              node_modules/next/dist/server/lib/router-utils/instrumentation-globals.external.js \
              node_modules/next/dist/server/lib/router-utils/instrumentation-globals.external.d.ts \
              node_modules/next/dist/server/lib/router-utils/instrumentation-globals.external.js.map \
              node_modules/next/dist/esm/server/lib/router-utils/instrumentation-globals.external.js \
              node_modules/next/dist/esm/server/lib/router-utils/instrumentation-globals.external.js.map; do
              if [ -f "$file" ]; then
                stat -c 'present mode=%a size=%s path=%n' "$file"
              else
                echo "missing path=$file"
              fi
            done

            echo "=== Instrumentation runtime inventory ==="
            find node_modules/next/dist -type f -name 'instrumentation-globals*' -printf '%s %p\n' 2>/dev/null | sort || true

            echo "=== Next router-utils inventory summary ==="
            find node_modules/next/dist/server/lib/router-utils -maxdepth 1 -type f -printf '%f\n' 2>/dev/null | sort | tail -n 80 || true

            echo "=== Relevant dependency tree ==="
            npm ls next postcss sharp --all --json 2>/dev/null \
              | node -e '
                  const fs = require("fs");
                  const data = JSON.parse(fs.readFileSync(0, "utf8"));
                  function clean(node) {
                    if (!node || typeof node !== "object") return node;
                    const result = {};
                    for (const key of ["version", "resolved", "overridden", "invalid", "extraneous"]) {
                      if (node[key] !== undefined) result[key] = node[key];
                    }
                    if (node.dependencies) {
                      result.dependencies = {};
                      for (const [name, child] of Object.entries(node.dependencies)) {
                        if (name === "next" || name === "postcss" || name === "sharp") {
                          result.dependencies[name] = clean(child);
                        }
                      }
                    }
                    return result;
                  }
                  console.log(JSON.stringify(clean(data), null, 2));
                ' || true
          fi

          echo "=== Canary PM2 logs ==="
          for file in "$HOME/.pm2/logs/${CANARY_NAME}-error.log" "$HOME/.pm2/logs/${CANARY_NAME}-out.log"; do
            if [ -f "$file" ]; then
              echo "--- $file ---"
              tail -n 100 "$file" \
                | sed -E 's#(postgresql://)[^[:space:]]+#\1[REDACTED]#g; s#(AUTH_SECRET|DATABASE_URL|PASSWORD|TOKEN)=([^[:space:]]+)#\1=[REDACTED]#g'
            fi
          done
          REMOTE
