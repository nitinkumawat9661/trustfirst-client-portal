name: Validate Celebration Pre-Animation Polish

on:
  push:
    branches:
      - validate/celebration-pre-animation-polish
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: celebration-site
    steps:
      - uses: actions/checkout@v5
      - name: Install
        run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev
      - name: Source and domain audit
        run: npm run audit
      - name: TypeScript
        run: npm run typecheck
      - name: Ensure animation layer is still untouched
        run: |
          ! grep -E "@keyframes|animation:" styles/production-polish.css
      - name: Production build
        run: npm run build
