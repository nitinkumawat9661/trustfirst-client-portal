name: Validate Celebration Checkout UX

on:
  push:
    branches:
      - sync/celebration-checkout-payment-state-ux

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: celebration-site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: celebration-site/package-lock.json

      - name: Install
        run: npm ci

      - name: Production audit
        run: npm audit --omit=dev

      - name: Project audit
        run: npm run audit

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
