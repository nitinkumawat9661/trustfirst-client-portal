name: Materialize Patched Minimatch Lockfile

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/materialize-minimatch-lock.yml"
      - "package.json"

permissions:
  contents: write

concurrency:
  group: materialize-minimatch-lock-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: agent/patch-minimatch-audit
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Regenerate only the affected lock entries
        shell: bash
        run: |
          set -euo pipefail
          npm update minimatch --package-lock-only --include=dev --ignore-scripts
          git diff --check
          git diff --exit-code -- package.json
          git diff --quiet -- package-lock.json && {
            echo "Expected package-lock.json to change." >&2
            exit 1
          }

      - name: Verify clean install and audits
        shell: bash
        run: |
          set -euo pipefail
          npm ci --include=dev
          npm ls minimatch brace-expansion --all
          npm audit --audit-level=high
          npm audit --omit=dev --audit-level=high

      - name: Commit regenerated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --check
          git commit -m "security: refresh lockfile for patched minimatch"
          git push origin HEAD:agent/patch-minimatch-audit
