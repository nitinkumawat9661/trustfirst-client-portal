name: Validate Estimate Sale Fast Entry

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/validate-estimate-sale-fast-entry.yml"
      - "scripts/.estimate-sale-fast-entry*/**"
      - "scripts/run_estimate_sale_fast_entry*.py"
      - "package.json"
      - "apps/web/**"

permissions:
  contents: read

concurrency:
  group: validate-estimate-sale-fast-entry-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out pull request merge ref
        uses: actions/checkout@v4

      - name: Verify standalone payload candidate
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          from pathlib import Path

          path = Path("scripts/.estimate-sale-fast-entry-v2/part-00.b64")
          encoded = path.read_text(encoding="utf-8").strip()
          print("STANDALONE_LENGTH", len(encoded))
          print("STANDALONE_SHA256", hashlib.sha256(encoded.encode("ascii")).hexdigest())
          try:
              decoded = base64.b64decode(encoded, validate=True)
              print("STANDALONE_DECODED_LENGTH", len(decoded))
              print("STANDALONE_DECODED_SHA256", hashlib.sha256(decoded).hexdigest())
              decoded.decode("utf-8")
              compile(decoded, str(path), "exec")
              print("STANDALONE_SOURCE_VALID")
          except Exception as error:
              print("STANDALONE_SOURCE_INVALID", type(error).__name__, str(error))
          PY

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and materialize source
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build --workspace @trustfirst/web

      - name: Verify materialized files
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/web/src/components/hardware/estimate-bill-form.tsx
          test -f 'apps/web/src/app/(platform)/admin/hardware/quotations/[documentId]/edit/page.tsx'
          test -f 'apps/web/src/app/api/hardware/trade/[documentId]/estimate/route.ts'
          git diff --check
          echo ESTIMATE_SALE_FAST_ENTRY_VALIDATION_SUCCESSFUL
