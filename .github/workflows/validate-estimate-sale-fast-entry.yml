name: Validate Estimate Sale Fast Entry

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/validate-estimate-sale-fast-entry.yml"
      - "scripts/.estimate-sale-fast-entry/**"
      - "scripts/run_estimate_sale_fast_entry*.py"
      - "package.json"
      - "apps/web/**"

permissions:
  contents: read

concurrency:
  group: validate-estimate-sale-fast-entry-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out pull request merge ref
        uses: actions/checkout@v4

      - name: Locate payload corruption
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path

          root = Path("scripts/.estimate-sale-fast-entry")
          names = ["part-00.b64", "part-01.b64", "part-02.b64", "part-02b.b64"]
          encoded = ""
          for name in names:
              value = (root / name).read_text().strip()
              encoded += value
              padded = encoded + "=" * ((4 - len(encoded) % 4) % 4)
              decoded = base64.b64decode(padded)
              try:
                  text = decoded.decode("utf-8")
                  print(f"STAGE {name}: UTF8_OK encoded={len(encoded)} decoded={len(decoded)} tail={text[-120:]!r}")
              except UnicodeDecodeError as error:
                  print(f"STAGE {name}: UTF8_FAIL encoded={len(encoded)} decoded={len(decoded)} start={error.start} end={error.end}")
                  print("BAD_BYTES", decoded[max(0, error.start - 40):error.start + 120].hex())
                  break
          part = (root / "part-02b.b64").read_text().strip()
          print("PART02B_FIRST", part[:120])
          print("PART02B_LAST", part[-240:])
          print("PART02B_LENGTH", len(part))
          PY

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and materialize source
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build --workspace @trustfirst/web

      - name: Verify materialized files
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/web/src/components/hardware/estimate-bill-form.tsx
          test -f 'apps/web/src/app/(platform)/admin/hardware/quotations/[documentId]/edit/page.tsx'
          test -f 'apps/web/src/app/api/hardware/trade/[documentId]/estimate/route.ts'
          git diff --check
          echo ESTIMATE_SALE_FAST_ENTRY_VALIDATION_SUCCESSFUL
