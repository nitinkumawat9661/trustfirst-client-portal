name: Validate Estimate Sale Fast Entry

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/validate-estimate-sale-fast-entry.yml"
      - "scripts/.estimate-sale-fast-entry*/**"
      - "scripts/run_estimate_sale_fast_entry*.py"
      - "package.json"
      - "apps/web/**"

permissions:
  contents: write

concurrency:
  group: validate-estimate-sale-fast-entry-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/estimate-sale-edit-fast-entry

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and materialize source
        run: npm ci

      - name: Persist readable application source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src
          if git diff --cached --quiet; then
            echo "Materialized source already committed."
          else
            git commit -m "feat: materialize Estimate sale fast-entry source"
            git push origin HEAD:feature/estimate-sale-edit-fast-entry
          fi

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build --workspace @trustfirst/web

      - name: Verify materialized files
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/web/src/components/hardware/estimate-bill-form.tsx
          test -f 'apps/web/src/app/(platform)/admin/hardware/quotations/[documentId]/edit/page.tsx'
          test -f 'apps/web/src/app/api/hardware/trade/[documentId]/estimate/route.ts'
          git diff --check
          echo ESTIMATE_SALE_FAST_ENTRY_VALIDATION_SUCCESSFUL
