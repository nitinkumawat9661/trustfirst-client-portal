name: Validate Estimate Sale Fast Entry

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/validate-estimate-sale-fast-entry.yml"
      - "scripts/.estimate-sale-fast-entry*/**"
      - "scripts/run_estimate_sale_fast_entry*.py"
      - "package.json"
      - "apps/web/**"

permissions:
  contents: read

concurrency:
  group: validate-estimate-sale-fast-entry-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out pull request merge ref
        uses: actions/checkout@v4

      - name: Decode second materializer gap boundaries
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path

          root = Path("scripts/.estimate-sale-fast-entry")
          part_02 = (root / "part-02.b64").read_text().strip()
          part_03 = (root / "part-03.b64").read_text().strip()
          left = base64.b64decode(part_02[3:]).decode("utf-8")
          right_encoded = part_03[3:]
          right_encoded = right_encoded[:len(right_encoded) - (len(right_encoded) % 4)]
          right = base64.b64decode(right_encoded).decode("utf-8")
          print("ESTIMATE_SECOND_LEFT_TAIL_BEGIN")
          print(left[-4200:])
          print("ESTIMATE_SECOND_LEFT_TAIL_END")
          print("ESTIMATE_SECOND_RIGHT_HEAD_BEGIN")
          print(right[:4200])
          print("ESTIMATE_SECOND_RIGHT_HEAD_END")
          PY

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and materialize source
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build --workspace @trustfirst/web

      - name: Verify materialized files
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/web/src/components/hardware/estimate-bill-form.tsx
          test -f 'apps/web/src/app/(platform)/admin/hardware/quotations/[documentId]/edit/page.tsx'
          test -f 'apps/web/src/app/api/hardware/trade/[documentId]/estimate/route.ts'
          git diff --check
          echo ESTIMATE_SALE_FAST_ENTRY_VALIDATION_SUCCESSFUL
