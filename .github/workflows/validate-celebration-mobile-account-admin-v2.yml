name: Validate Celebration Mobile Account Admin V2

on:
  push:
    branches:
      - feat/celebration-mobile-account-dashboard-admin-v2

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: celebration-site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: celebration-site/package-lock.json
      - run: npm ci
      - run: npm run audit
      - run: npm run typecheck
      - run: npm run build
