name: Temporary Next Lock Dedupe
on:
  push:
    branches:
      - fix/next-security-16-4-audit-20261013
    paths:
      - .github/workflows/temporary-next-lock-refresh.yml
permissions:
  contents: write
jobs:
  dedupe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Resolve and deduplicate dependency lock
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm dedupe --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          node -e 'const p = require("./package-lock.json").packages; if(p["node_modules/next"]?.version !== "16.4.0") { console.error("Still shipping root next:", p["node_modules/next"]?.version); process.exit(1); }'
      - name: Commit dependency lock
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(lockfile): dedupe Next.js patched dependencies"
            git push origin HEAD:fix/next-security-16-4-audit-20261013
          fi
