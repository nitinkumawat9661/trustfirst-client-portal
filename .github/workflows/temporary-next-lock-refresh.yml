# Temporary branch-scoped lockfile regeneration. Remove before merging.
name: Temporary Next Lock Refresh
on:
  push:
    branches:
      - fix/next-security-16-4-audit-20261013
    paths:
      - .github/workflows/temporary-next-lock-refresh.yml
      - apps/web/package.json
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Update only the dependency lockfile
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          echo 'Security audit runs in the required PR checks after lock refresh.'
      - name: Commit refreshed lockfile
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile unchanged"
          else
            git commit -m "fix(lockfile): resolve patched Next 16.4.0 dependencies"
            git push origin HEAD:fix/next-security-16-4-audit-20261013
          fi
