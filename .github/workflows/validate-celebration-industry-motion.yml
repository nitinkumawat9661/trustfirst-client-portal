name: Validate Celebration Industry Motion

on:
  push:
    branches:
      - validate/celebration-industry-motion
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: celebration-site
    steps:
      - uses: actions/checkout@v5
      - name: Install
        run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev
      - name: Source and domain audit
        run: npm run audit
      - name: TypeScript
        run: npm run typecheck
      - name: Verify approved motion layer
        run: |
          grep -q 'ShapeWaves' features/home/Hero.tsx
          grep -q 'rotationFactor={11}' features/catalog/BudgetSection.tsx
          grep -q 'premiumSpotlight' styles/motion.css
          grep -q 'prefers-reduced-motion' styles/motion.css
          grep -q 'ProofAndReviews' features/home/Storefront.tsx
          grep -q 'textAccent' styles/motion.css
      - name: Production build
        run: npm run build
