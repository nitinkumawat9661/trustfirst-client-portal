name: Fix Celebration MSG91 Captcha Gate

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-celebration-msg91-captcha-gate.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Patch broken client-side captcha gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('celebration-site/features/account/CustomerAuthPanel.tsx')
          text = path.read_text()

          old_effect = '''  useEffect(() => {\n    if (screen !== "forgot-phone" || !widgetReady) {\n      setCaptchaVerified(false)\n      return\n    }\n    const syncCaptchaState = () => setCaptchaVerified(window.isCaptchaVerified?.() === true)\n    syncCaptchaState()\n    const timer = window.setInterval(syncCaptchaState, 250)\n    return () => window.clearInterval(timer)\n  }, [screen, widgetReady])\n\n'''
          if old_effect not in text:
              raise SystemExit('captcha polling block not found')
          text = text.replace(old_effect, '', 1)

          old_gate = '''      if (!captchaVerified || window.isCaptchaVerified?.() !== true) {\n        setCaptchaVerified(false)\n        return\n      }\n\n'''
          if old_gate not in text:
              raise SystemExit('sendOtp captcha gate block not found')
          text = text.replace(old_gate, '', 1)

          old_button = 'disabled={actionBusy || (!widgetReady && !resetPhoneReady) || (widgetReady && !captchaVerified)}'
          new_button = 'disabled={actionBusy || (!widgetReady && !resetPhoneReady)}'
          if old_button not in text:
              raise SystemExit('captcha-disabled button expression not found')
          text = text.replace(old_button, new_button, 1)

          old_small = '{captchaVerified ? "Verified — OTP sending is now enabled." : widgetReady ? "Complete the check below to enable OTP." : "Continue once to load the protected check."}'
          new_small = '{captchaVerified ? "Verified — OTP sending is now enabled." : widgetReady ? "Complete the provider security check, then send OTP." : "Continue once to load the protected check."}'
          if old_small not in text:
              raise SystemExit('captcha helper copy not found')
          text = text.replace(old_small, new_small, 1)

          path.write_text(text)
          PY

          cd celebration-site
          npm ci
          npm run typecheck
          npm run audit

      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add celebration-site/features/account/CustomerAuthPanel.tsx
          git diff --cached --quiet && { echo "No source change required"; exit 0; }
          git commit -m "Fix MSG91 captcha send gate"
          git push origin HEAD:main

      - name: Deploy patched Celebration main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run deploy-celebration-production.yml --ref main --repo "${GITHUB_REPOSITORY}"
