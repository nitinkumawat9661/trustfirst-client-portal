name: Celebration Campaign Runtime Smoke

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/celebration-campaign-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_ROOT: /var/www/celebration
  APP_PORT: "3040"
  PM2_HOME: /home/nitin/.pm2

jobs:
  smoke:
    name: Read-only campaign runtime verification
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
    steps:
      - name: Configure verified SSH access
        shell: bash
        run: |
          set -euo pipefail
          for name in VPS_HOST VPS_PORT VPS_USER VPS_SSH_PRIVATE_KEY VPS_KNOWN_HOSTS; do
            [ -n "${!name:-}" ] || { echo "Missing required value: $name" >&2; exit 1; }
          done
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/celebration_smoke"
          printf '%s\n' "$VPS_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/celebration_smoke" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/celebration_smoke" >/dev/null
          ssh-keygen -F "$VPS_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null

      - name: Verify production campaign runtime
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -p "$VPS_PORT" \
            -i "$HOME/.ssh/celebration_smoke" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            bash -s -- "$APP_ROOT" "$APP_PORT" "$PM2_HOME" <<'REMOTE'
          set -euo pipefail
          APP_ROOT="$1"
          PORT="$2"
          PM2_HOME="$3"
          CURRENT="$(readlink -f "$APP_ROOT/current")"
          BASE="http://127.0.0.1:${PORT}"

          case "$CURRENT" in
            "$APP_ROOT"/releases/github-*) ;;
            *) echo "Unexpected active release: $CURRENT" >&2; exit 1 ;;
          esac
          printf 'CURRENT=%s\n' "$CURRENT"

          sudo -u nitin env PM2_HOME="$PM2_HOME" pm2 jlist | node -e '
            const fs = require("fs");
            const list = JSON.parse(fs.readFileSync(0, "utf8"));
            const app = list.find((item) => item.name === "celebration-site");
            if (!app || app.pm2_env?.status !== "online") process.exit(1);
            const cwd = String(app.pm2_env?.pm_cwd || "");
            if (!cwd.includes("/var/www/celebration/releases/github-")) process.exit(1);
            console.log(JSON.stringify({pm2: "online", cwd}));
          '

          HEALTH="$(curl --silent --show-error --fail --max-time 8 "$BASE/api/health")"
          printf '%s\n' "$HEALTH" | node -e '
            const fs = require("fs");
            const v = JSON.parse(fs.readFileSync(0, "utf8"));
            if (v.ok !== true || v.service !== "Celebration") process.exit(1);
            console.log(JSON.stringify({health: true, service: v.service}));
          '

          CATALOG="$(curl --silent --show-error --fail --max-time 8 "$BASE/api/catalog")"
          printf '%s\n' "$CATALOG" | node -e '
            const fs = require("fs");
            const v = JSON.parse(fs.readFileSync(0, "utf8"));
            if (v.ok !== true || !Array.isArray(v.catalog?.tiers) || !Array.isArray(v.catalog?.products)) process.exit(1);
            console.log(JSON.stringify({catalog: true, tiers: v.catalog.tiers.length, products: v.catalog.products.length}));
          '

          ADMIN_CAMPAIGNS="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 8 "$BASE/api/admin/campaigns")"
          ADMIN_ANALYTICS="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 8 "$BASE/api/admin/analytics")"
          ACCOUNT_ORDERS="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 8 "$BASE/api/account/orders")"
          OFFER_AUTH="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 8 -X POST -H 'Origin: http://127.0.0.1:3040' -H 'Content-Type: application/json' --data '{"tierId":"x","selectedProductIds":[],"trigger":"checkout"}' "$BASE/api/offers/quote")"
          test "$ADMIN_CAMPAIGNS" = "401"
          test "$ADMIN_ANALYTICS" = "401"
          test "$ACCOUNT_ORDERS" = "401"
          test "$OFFER_AUTH" = "401"
          printf 'AUTH_BOUNDARIES campaigns=%s analytics=%s accountOrders=%s offerQuote=%s\n' "$ADMIN_CAMPAIGNS" "$ADMIN_ANALYTICS" "$ACCOUNT_ORDERS" "$OFFER_AUTH"

          sudo -u nitin env HOME=/home/nitin bash -c 'cd "$1" && node <<'"'"'NODE'"'"'
          const { loadEnvConfig } = require("@next/env");
          loadEnvConfig(process.cwd(), false);
          const { Client } = require("pg");
          const ssl = process.env.DATABASE_SSL_MODE === "disable" ? false : { rejectUnauthorized: true };
          const client = new Client({ connectionString: process.env.DATABASE_URL, ssl });
          (async () => {
            await client.connect();
            const tables = await client.query("SELECT to_regclass('public.campaign_config') AS campaign_config, to_regclass('public.offer_quotes') AS offer_quotes, to_regclass('public.conversion_events') AS conversion_events");
            const row = tables.rows[0] || {};
            if (!row.campaign_config || !row.offer_quotes || !row.conversion_events) throw new Error("campaign tables missing");
            const cols = await client.query("SELECT column_name FROM information_schema.columns WHERE table_schema='public' AND table_name='orders' AND column_name = ANY($1::text[])", [["subtotal_paise","discount_paise","campaign_id","campaign_title","offer_quote_id"]]);
            if (cols.rowCount !== 5) throw new Error("order campaign columns missing");
            const migration = await client.query("SELECT 1 FROM schema_migrations WHERE name = '005_campaigns_conversion_analytics.sql'");
            if (migration.rowCount !== 1) throw new Error("migration 005 not recorded");
            console.log(JSON.stringify({schema: true, campaignTables: 3, orderCampaignColumns: 5, migration005: true}));
            await client.end();
          })().catch(async (error) => { console.error(error.message); try { await client.end(); } catch {} process.exit(1); });
          NODE' _ "$CURRENT"
          REMOTE
