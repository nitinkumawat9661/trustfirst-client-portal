name: Verify Mangalam Production Deployment

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verify-mangalam-deployment.yml"

permissions:
  contents: read
  statuses: write

env:
  TARGET_SHA: 6b2f075f509b1532324a9f600aba850e40af2e95

jobs:
  mark-pending:
    runs-on: ubuntu-latest
    steps:
      - name: Publish pending verification status
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg state pending \
            --arg target_url "$RUN_URL" \
            --arg description "Waiting for Mangalam VPS deployment verification" \
            --arg context "Mangalam Production Verification" \
            '{state: $state, target_url: $target_url, description: $description, context: $context}' \
            > status.json
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$TARGET_SHA" \
            --data @status.json

  verify:
    needs: mark-pending
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production

    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}

    steps:
      - name: Configure verified SSH access
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s' "$VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/trustfirst_deploy"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/trustfirst_deploy" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/trustfirst_deploy" >/dev/null

      - name: Wait for exact deployed commit and verify live endpoints
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            deployed_sha="$(ssh \
              -p "$VPS_PORT" \
              -i "$HOME/.ssh/trustfirst_deploy" \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              "$VPS_USER@$VPS_HOST" \
              "cat '$DEPLOY_PATH/.trustfirst-deployed-commit' 2>/dev/null || true")"

            if [ "$deployed_sha" = "$TARGET_SHA" ]; then
              curl --silent --show-error --fail --max-time 15 "$PRODUCTION_URL/api/auth/session" >/dev/null
              curl --silent --show-error --fail --max-time 15 "$PUBLIC_URL" >/dev/null
              echo "VERIFIED_DEPLOYED_SHA=$deployed_sha"
              echo "MANGALAM_PRODUCTION_VERIFIED"
              exit 0
            fi

            echo "Attempt $attempt: deployed marker is '${deployed_sha:-missing}', waiting for $TARGET_SHA"
            sleep 10
          done

          echo "Exact Mangalam production commit was not observed before timeout." >&2
          exit 1

  report:
    if: always()
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Publish final verification status
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$VERIFY_RESULT" = "success" ]; then
            state="success"
            description="Mangalam VPS commit and live endpoints verified"
          else
            state="failure"
            description="Mangalam VPS deployment verification failed"
          fi

          jq -n \
            --arg state "$state" \
            --arg target_url "$RUN_URL" \
            --arg description "$description" \
            --arg context "Mangalam Production Verification" \
            '{state: $state, target_url: $target_url, description: $description, context: $context}' \
            > status.json
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$TARGET_SHA" \
            --data @status.json
