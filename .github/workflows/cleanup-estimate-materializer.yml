name: Cleanup Estimate Recovery Artifacts

on:
  push:
    branches:
      - feature/estimate-sale-edit-fast-entry
    paths:
      - ".github/workflows/cleanup-estimate-materializer.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/estimate-sale-edit-fast-entry

      - name: Remove temporary recovery files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r --ignore-unmatch \
            scripts/.estimate-sale-fast-entry \
            scripts/.estimate-sale-fast-entry-v2 \
            scripts/run_estimate_sale_fast_entry.py \
            scripts/run_estimate_sale_fast_entry_v2.py \
            scripts/fix_estimate_sale_types.py \
            .github/workflows/cleanup-estimate-materializer.yml
          git commit -m "chore: remove temporary Estimate recovery artifacts"
          git push origin HEAD:feature/estimate-sale-edit-fast-entry
