name: Celebration VPS Preflight

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/celebration-vps-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_DOMAIN: shopcelebration.in
  TARGET_PATH: /var/www/celebration
  EXPECTED_PORT: "3040"

jobs:
  inspect:
    name: Safe Celebration VPS inspection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}

    steps:
      - name: Validate SSH configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in VPS_HOST VPS_PORT VPS_USER VPS_SSH_PRIVATE_KEY VPS_KNOWN_HOSTS; do
            [ -n "${!name:-}" ] || { echo "Missing required value: $name" >&2; exit 1; }
          done

      - name: Configure verified SSH access
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/celebration_preflight"
          printf '%s\n' "$VPS_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/celebration_preflight" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/celebration_preflight" >/dev/null
          ssh-keygen -F "$VPS_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null

      - name: Inspect Celebration runtime safely
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -p "$VPS_PORT" \
            -i "$HOME/.ssh/celebration_preflight" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            bash -s -- "$TARGET_DOMAIN" "$TARGET_PATH" "$EXPECTED_PORT" <<'REMOTE'
          set -euo pipefail
          DOMAIN="$1"
          APP_DIR="$2"
          PORT="$3"
          BASE="http://127.0.0.1:${PORT}"

          echo "=== TARGET ==="
          test "$(readlink -f "$APP_DIR")" = "/var/www/celebration"
          CURRENT="$(readlink -f "$APP_DIR/current")"
          printf 'APP_DIR=%s\n' "$APP_DIR"
          printf 'CURRENT=%s\n' "$CURRENT"

          echo "=== NITIN PM2 SAFE MAP ==="
          sudo -u nitin env PM2_HOME=/home/nitin/.pm2 pm2 jlist | node -e '
            const fs = require("fs");
            const list = JSON.parse(fs.readFileSync(0, "utf8"));
            for (const item of list) {
              const env = item.pm2_env || {};
              const out = {
                id: item.pm_id,
                name: String(item.name || env.name || ""),
                pid: item.pid || "",
                status: String(env.status || ""),
                cwd: String(env.pm_cwd || ""),
                script: String(env.pm_exec_path || env.script || ""),
                args: Array.isArray(env.args) ? env.args.join(" ") : String(env.args || ""),
                interpreter: String(env.exec_interpreter || "")
              };
              console.log(JSON.stringify(out));
            }
          '

          echo "=== CURRENT RELEASE LINKS (NAMES ONLY) ==="
          find "$CURRENT" -maxdepth 1 -type l -printf '%f -> %l\n' 2>/dev/null | sort || true

          echo "=== SHARED ENTRY NAMES ==="
          find "$APP_DIR/shared" -mindepth 1 -maxdepth 1 -printf '%f\n' 2>/dev/null | sort || true

          echo "=== PORT LISTENER ==="
          sudo ss -ltnp 2>/dev/null | grep -E "[:.]${PORT}[[:space:]]" || true

          echo "=== NGINX DOMAIN REFERENCES ==="
          sudo grep -R -n -E "server_name[[:space:]].*${DOMAIN}|proxy_pass[[:space:]].*127\\.0\\.0\\.1:${PORT}" /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null || true

          echo "=== LOOPBACK HEALTH ==="
          curl --silent --show-error --fail --max-time 5 "$BASE/api/health"
          echo

          echo "=== PUBLIC PAGES ==="
          HOME_STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 8 "$BASE/")"
          ACCOUNT_STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 8 "$BASE/account")"
          test "$HOME_STATUS" = "200"
          test "$ACCOUNT_STATUS" = "200"
          printf 'HOME_STATUS=%s ACCOUNT_PAGE_STATUS=%s\n' "$HOME_STATUS" "$ACCOUNT_STATUS"

          echo "=== RUNTIME CATALOG ==="
          CATALOG="$(curl --silent --show-error --fail --max-time 8 "$BASE/api/catalog")"
          printf '%s\n' "$CATALOG" | node -e '
            const fs = require("fs");
            const value = JSON.parse(fs.readFileSync(0, "utf8"));
            if (value.ok !== true || !value.catalog || !Array.isArray(value.catalog.tiers) || !Array.isArray(value.catalog.products)) process.exit(1);
            if (value.catalog.tiers.length < 1) process.exit(1);
            console.log(JSON.stringify({ok: value.ok, version: value.version, tiers: value.catalog.tiers.length, products: value.catalog.products.length, occasions: value.catalog.occasions?.length || 0}));
          '

          echo "=== RUNTIME SUPPORT SETTINGS ==="
          SETTINGS="$(curl --silent --show-error --fail --max-time 8 "$BASE/api/store-settings")"
          printf '%s\n' "$SETTINGS" | node -e '
            const fs = require("fs");
            const value = JSON.parse(fs.readFileSync(0, "utf8"));
            const digits = String(value.settings?.whatsapp || "").replace(/\D/g, "");
            if (value.ok !== true || !value.settings || digits !== "917414853321") process.exit(1);
            if (!String(value.settings.assistTitle || "").toLowerCase().includes("budget")) process.exit(1);
            console.log(JSON.stringify({ok: value.ok, version: value.version, whatsappConfigured: true, assistTitle: value.settings.assistTitle}));
          '

          echo "=== CUSTOMER ACCOUNT AUTH BOUNDARIES ==="
          ME="$(curl --silent --show-error --fail --max-time 5 "$BASE/api/account/me")"
          printf '%s\n' "$ME" | node -e '
            const fs = require("fs");
            const value = JSON.parse(fs.readFileSync(0, "utf8"));
            if (value.ok !== true || value.account !== null) process.exit(1);
            console.log(JSON.stringify({ok: value.ok, anonymousAccount: value.account}));
          '
          ORDERS_STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 5 "$BASE/api/account/orders")"
          test "$ORDERS_STATUS" = "401"
          printf 'UNAUTHENTICATED_ACCOUNT_ORDERS_STATUS=%s\n' "$ORDERS_STATUS"

          echo "=== ADMIN AUTH BOUNDARY ==="
          ADMIN_STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 5 "$BASE/api/admin/catalog")"
          HISTORY_STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 5 "$BASE/api/admin/catalog/history")"
          test "$ADMIN_STATUS" = "401"
          test "$HISTORY_STATUS" = "401"
          printf 'UNAUTHENTICATED_ADMIN_CATALOG_STATUS=%s HISTORY_STATUS=%s\n' "$ADMIN_STATUS" "$HISTORY_STATUS"
          REMOTE
