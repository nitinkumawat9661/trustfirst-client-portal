name: Celebration VPS Preflight

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/celebration-vps-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_DOMAIN: shopcelebration.in
  TARGET_PATH: /var/www/celebration
  EXPECTED_PORT: "3040"

jobs:
  inspect:
    name: Read-only Celebration VPS inspection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}

    steps:
      - name: Validate SSH configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in VPS_HOST VPS_PORT VPS_USER VPS_SSH_PRIVATE_KEY VPS_KNOWN_HOSTS; do
            [ -n "${!name:-}" ] || { echo "Missing required value: $name" >&2; exit 1; }
          done

      - name: Configure verified SSH access
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/celebration_preflight"
          printf '%s\n' "$VPS_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/celebration_preflight" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/celebration_preflight" >/dev/null
          ssh-keygen -F "$VPS_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null

      - name: Inspect Celebration runtime without changes
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -p "$VPS_PORT" \
            -i "$HOME/.ssh/celebration_preflight" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            bash -s -- "$TARGET_DOMAIN" "$TARGET_PATH" "$EXPECTED_PORT" <<'REMOTE'
          set -euo pipefail
          DOMAIN="$1"
          APP_DIR="$2"
          PORT="$3"

          echo "=== TARGET ==="
          test "$(readlink -f "$APP_DIR")" = "/var/www/celebration"
          printf 'APP_DIR=%s\n' "$APP_DIR"
          printf 'CURRENT=%s\n' "$(readlink -f "$APP_DIR/current")"

          echo "=== CURRENT RELEASE SAFE INVENTORY ==="
          CURRENT="$(readlink -f "$APP_DIR/current")"
          test -d "$CURRENT"
          find "$CURRENT" -mindepth 1 -maxdepth 1 \
            ! -name '.env*' \
            ! -name 'node_modules' \
            ! -name '.next' \
            -printf '%f\n' 2>/dev/null | sort

          echo "=== SHARED SAFE INVENTORY ==="
          find "$APP_DIR/shared" -mindepth 1 -maxdepth 1 \
            ! -name '.env*' \
            -printf '%f\n' 2>/dev/null | sort || true

          echo "=== PORT LISTENER AND ANCESTRY ==="
          LISTENER_LINE="$(sudo ss -ltnp 2>/dev/null | grep -E "[:.]${PORT}[[:space:]]" | head -n 1 || true)"
          printf '%s\n' "$LISTENER_LINE"
          PID="$(printf '%s\n' "$LISTENER_LINE" | sed -n 's/.*pid=\([0-9][0-9]*\).*/\1/p' | head -n 1)"
          if [ -n "$PID" ]; then
            echo "LISTENER_PID=$PID"
            CURRENT_PID="$PID"
            i=0
            while [ -n "$CURRENT_PID" ] && [ "$CURRENT_PID" -gt 1 ] 2>/dev/null && [ "$i" -lt 12 ]; do
              sudo ps -o pid=,ppid=,user=,cmd= -p "$CURRENT_PID" 2>/dev/null || true
              CURRENT_PID="$(sudo ps -o ppid= -p "$CURRENT_PID" 2>/dev/null | tr -d ' ' || true)"
              i=$((i+1))
            done
          fi

          echo "=== SYSTEMD REFERENCES ==="
          sudo grep -R -n -E '/var/www/celebration|3040|shopcelebration' /etc/systemd/system /lib/systemd/system 2>/dev/null | head -n 80 || true
          sudo systemctl list-units --type=service --all --no-pager 2>/dev/null | grep -Ei 'celebration|next|node' || true

          echo "=== NGINX DOMAIN REFERENCES ==="
          sudo grep -R -n -E "server_name[[:space:]].*${DOMAIN}|proxy_pass[[:space:]].*127\\.0\\.0\\.1:${PORT}" /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null || true

          echo "=== LOOPBACK HEALTH ==="
          curl --silent --show-error --fail --max-time 5 "http://127.0.0.1:${PORT}/api/health"
          echo
          REMOTE
