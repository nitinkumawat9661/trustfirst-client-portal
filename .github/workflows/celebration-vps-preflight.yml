name: Celebration VPS Preflight

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/celebration-vps-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_DOMAIN: shopcelebration.in
  TARGET_PATH: /var/www/celebration
  EXPECTED_PORT: "3040"

jobs:
  inspect:
    name: Read-only Celebration VPS inspection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}

    steps:
      - name: Validate SSH configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in VPS_HOST VPS_PORT VPS_USER VPS_SSH_PRIVATE_KEY VPS_KNOWN_HOSTS; do
            [ -n "${!name:-}" ] || { echo "Missing required value: $name" >&2; exit 1; }
          done

      - name: Configure verified SSH access
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/celebration_preflight"
          printf '%s\n' "$VPS_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/celebration_preflight" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/celebration_preflight" >/dev/null
          ssh-keygen -F "$VPS_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null

      - name: Inspect Celebration runtime without changes
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -p "$VPS_PORT" \
            -i "$HOME/.ssh/celebration_preflight" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            bash -s -- "$TARGET_DOMAIN" "$TARGET_PATH" "$EXPECTED_PORT" <<'REMOTE'
          set -euo pipefail
          DOMAIN="$1"
          APP_DIR="$2"
          PORT="$3"

          echo "=== USER ==="
          id -un

          echo "=== TARGET PATH ==="
          test -d "$APP_DIR"
          printf 'APP_DIR=%s\n' "$APP_DIR"
          printf 'REALPATH=%s\n' "$(readlink -f "$APP_DIR")"

          echo "=== SAFE TOP-LEVEL SOURCE INVENTORY ==="
          find "$APP_DIR" -mindepth 1 -maxdepth 1 \
            ! -name '.env*' \
            ! -name 'node_modules' \
            ! -name '.next' \
            -printf '%f\n' 2>/dev/null | sort

          echo "=== PM2 SAFE PROCESS LIST ==="
          pm2 jlist | node -e '
            const fs = require("fs");
            const list = JSON.parse(fs.readFileSync(0, "utf8"));
            for (const item of list) {
              const env = item.pm2_env || {};
              console.log(`PM2_ID=${item.pm_id} NAME=${String(item.name || env.name || "")} PID=${item.pid || ""} STATUS=${String(env.status || "")} CWD=${String(env.pm_cwd || "")} SCRIPT=${String(env.pm_exec_path || env.script || "")}`);
            }
          '

          echo "=== PORT ${PORT} LISTENER ==="
          if command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
            sudo ss -ltnp 2>/dev/null | grep -E "[:.]${PORT}[[:space:]]" || true
          else
            ss -ltnp 2>/dev/null | grep -E "[:.]${PORT}[[:space:]]" || true
          fi

          echo "=== NGINX DOMAIN REFERENCES ==="
          if command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
            sudo grep -R -n -E "server_name[[:space:]].*${DOMAIN}|proxy_pass[[:space:]].*127\\.0\\.0\\.1:${PORT}" /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null || true
          else
            grep -R -n -E "server_name[[:space:]].*${DOMAIN}|proxy_pass[[:space:]].*127\\.0\\.0\\.1:${PORT}" /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null || true
          fi

          echo "=== LOOPBACK HEALTH ==="
          curl --silent --show-error --fail --max-time 5 "http://127.0.0.1:${PORT}/api/health"
          echo
          REMOTE
