name: Deploy Mangalam ERP Production

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-mangalam-production.yml"
      - "apps/**"
      - "packages/**"
      - "scripts/deploy-production-ci.sh"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: mangalam-production
  cancel-in-progress: false

jobs:
  status-start:
    name: Mark deployment pending
    runs-on: ubuntu-latest
    steps:
      - name: Publish pending commit status
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg state pending \
            --arg target_url "$RUN_URL" \
            --arg description "Mangalam production deployment is running" \
            --arg context "Mangalam Production Deployment" \
            '{state: $state, target_url: $target_url, description: $description, context: $context}' \
            > status.json
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$GITHUB_SHA" \
            --data @status.json

  validate:
    name: Validate release
    needs: status-start
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Validate deployment script syntax
        run: bash -n scripts/deploy-production-ci.sh

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  deploy:
    name: Canary and production deploy
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production

    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      PM2_APP_NAME: ${{ vars.PM2_APP_NAME }}
      PRODUCTION_PORT: ${{ vars.PRODUCTION_PORT }}
      CANARY_PORT: ${{ vars.CANARY_PORT }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}

    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          required=(
            VPS_HOST VPS_PORT VPS_USER VPS_SSH_PRIVATE_KEY VPS_KNOWN_HOSTS
            DEPLOY_PATH PM2_APP_NAME PRODUCTION_PORT CANARY_PORT
            PRODUCTION_URL PUBLIC_URL
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Missing GitHub production environment value: $name" >&2
              exit 1
            fi
          done
          [ "$DEPLOY_PATH" = "/var/www/trustfirst-client-portal" ]
          [ "$PM2_APP_NAME" = "trustfirst-client-portal" ]
          [ "$PRODUCTION_PORT" = "3010" ]
          [ "$CANARY_PORT" = "3012" ]
          [ "$PRODUCTION_PORT" != "3000" ]
          [ "$CANARY_PORT" != "3000" ]

      - name: Configure verified SSH access
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/trustfirst_deploy"
          printf '%s\n' "$VPS_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/trustfirst_deploy" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/trustfirst_deploy" >/dev/null
          ssh-keygen -F "$VPS_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null

      - name: Read-only VPS preflight
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -p "$VPS_PORT" \
            -i "$HOME/.ssh/trustfirst_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            bash -s -- "$VPS_USER" "$DEPLOY_PATH" "$PM2_APP_NAME" "$PRODUCTION_PORT" <<'REMOTE'
          set -euo pipefail
          EXPECTED_USER="$1"
          APP_DIR="$2"
          PM2_PROCESS="$3"
          PROD_PORT="$4"

          check() {
            local label="$1"
            shift
            if "$@"; then
              echo "PREFLIGHT_OK:$label"
            else
              echo "PREFLIGHT_FAIL:$label" >&2
              exit 1
            fi
          }

          echo "PREFLIGHT_PATH=$PATH"
          check user_matches test "$(id -un)" = "$EXPECTED_USER"
          check app_directory_exists test -d "$APP_DIR"
          if [ -w "$APP_DIR" ]; then
            echo "PREFLIGHT_OK:app_directory_writable"
          else
            check sudo_available command -v sudo
            check passwordless_sudo sudo -n true
            echo "PREFLIGHT_OK:app_directory_repairable_via_sudo"
          fi
          check env_file_readable test -r /etc/trustfirst-client-portal.env
          check node_available command -v node
          check npm_available command -v npm
          check pm2_available command -v pm2
          check curl_available command -v curl
          check tar_available command -v tar
          check ss_available command -v ss
          node --version
          npm --version
          pm2 --version

          if pm2 describe "$PM2_PROCESS" >/dev/null 2>&1; then
            echo "PREFLIGHT_OK:trustfirst_pm2_process"
          elif ss -ltn 2>/dev/null | grep -Eq "[:.]${PROD_PORT}[[:space:]]"; then
            echo "PREFLIGHT_FAIL:production_port_occupied_without_expected_pm2" >&2
            exit 1
          else
            echo "PREFLIGHT_OK:trustfirst_pm2_first_start"
          fi

          echo VPS_PREFLIGHT_PASSED
          REMOTE

      - name: Package exact tracked release
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output="trustfirst-${GITHUB_SHA}.tar.gz" "$GITHUB_SHA"
          test -s "trustfirst-${GITHUB_SHA}.tar.gz"

      - name: Upload release and deployment script
        shell: bash
        run: |
          set -euo pipefail
          scp \
            -P "$VPS_PORT" \
            -i "$HOME/.ssh/trustfirst_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "trustfirst-${GITHUB_SHA}.tar.gz" \
            "scripts/deploy-production-ci.sh" \
            "$VPS_USER@$VPS_HOST:/tmp/"

      - name: Deploy through canary with rollback
        shell: bash
        run: |
          set -euo pipefail
          remote_archive="/tmp/trustfirst-${GITHUB_SHA}.tar.gz"
          remote_script="/tmp/deploy-production-ci.sh"

          ssh \
            -p "$VPS_PORT" \
            -i "$HOME/.ssh/trustfirst_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "chmod 700 '$remote_script' && \
             DEPLOY_SHA='$GITHUB_SHA' \
             DEPLOY_ARCHIVE='$remote_archive' \
             DEPLOY_PATH='$DEPLOY_PATH' \
             PM2_APP_NAME='$PM2_APP_NAME' \
             PRODUCTION_PORT='$PRODUCTION_PORT' \
             CANARY_PORT='$CANARY_PORT' \
             PRODUCTION_URL='$PRODUCTION_URL' \
             PUBLIC_URL='$PUBLIC_URL' \
             bash '$remote_script'; \
             status=\$?; \
             rm -f '$remote_script' '$remote_archive'; \
             exit \$status"

      - name: Verify deployed commit
        shell: bash
        run: |
          set -euo pipefail
          deployed_sha="$(ssh \
            -p "$VPS_PORT" \
            -i "$HOME/.ssh/trustfirst_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "cat '$DEPLOY_PATH/.trustfirst-deployed-commit'")"
          [ "$deployed_sha" = "$GITHUB_SHA" ]
          curl --silent --show-error --fail --max-time 15 "$PRODUCTION_URL/api/auth/session" >/dev/null
          curl --silent --show-error --fail --max-time 15 "$PUBLIC_URL" >/dev/null
          echo "DEPLOYED_SHA=$deployed_sha"
          echo "MANGALAM_PRODUCTION_DEPLOYMENT_SUCCESSFUL"

  status-final:
    name: Publish final deployment status
    if: always()
    needs:
      - validate
      - deploy
    runs-on: ubuntu-latest
    steps:
      - name: Publish final commit status
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$VALIDATE_RESULT" = "success" ] && [ "$DEPLOY_RESULT" = "success" ]; then
            state="success"
            description="Mangalam production deployment succeeded"
          else
            state="failure"
            description="Mangalam deployment failed: validate=$VALIDATE_RESULT deploy=$DEPLOY_RESULT"
          fi

          jq -n \
            --arg state "$state" \
            --arg target_url "$RUN_URL" \
            --arg description "$description" \
            --arg context "Mangalam Production Deployment" \
            '{state: $state, target_url: $target_url, description: $description, context: $context}' \
            > status.json
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$GITHUB_SHA" \
            --data @status.json
