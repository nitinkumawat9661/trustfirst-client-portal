name: Celebration Hydration Split Lighthouse

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: celebration-site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: celebration-site/package-lock.json
      - name: Install and validate
        run: |
          npm ci
          npm audit --omit=dev
          npm run audit
          npm run typecheck
          npm run build
      - name: Start production server
        run: |
          npm start -- -H 127.0.0.1 -p 3099 > /tmp/celebration-current-server.log 2>&1 &
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:3099/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/celebration-current-server.log
          exit 1
      - name: Lighthouse storefront
        run: |
          npx --yes lighthouse@12.8.2 http://127.0.0.1:3099/ \
            --quiet \
            --chrome-flags="--headless --no-sandbox --disable-gpu" \
            --only-categories=performance,accessibility,best-practices,seo \
            --form-factor=mobile \
            --screenEmulation.mobile=true \
            --screenEmulation.width=390 \
            --screenEmulation.height=844 \
            --screenEmulation.deviceScaleFactor=2 \
            --throttling-method=simulate \
            --output=json \
            --output-path=/tmp/home-lighthouse.json
          node - <<'NODE'
          const fs=require('fs');const r=JSON.parse(fs.readFileSync('/tmp/home-lighthouse.json','utf8'));const s=k=>Math.round((r.categories[k]?.score||0)*100);const a=k=>r.audits[k]?.displayValue||r.audits[k]?.numericValue;console.log('LIGHTHOUSE_HOME='+JSON.stringify({performance:s('performance'),accessibility:s('accessibility'),bestPractices:s('best-practices'),seo:s('seo'),FCP:a('first-contentful-paint'),LCP:a('largest-contentful-paint'),TBT:a('total-blocking-time'),CLS:a('cumulative-layout-shift'),SpeedIndex:a('speed-index'),interactive:a('interactive')}))
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: celebration-home-lighthouse
          path: /tmp/home-lighthouse.json
          if-no-files-found: warn
          retention-days: 1
