name: Celebration Hydration Split Lighthouse

on:
  push:
    branches:
      - perf/mobile-hero-marquee
    paths:
      - celebration-site/**
      - .github/workflows/celebration-lighthouse-current-main.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: celebration-site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: celebration-site/package-lock.json
      - name: Install and validate
        run: |
          npm ci
          npm audit --omit=dev
          npm run audit
          npm run typecheck
          npm run build
      - name: Start production server
        run: |
          npm start -- -H 127.0.0.1 -p 3099 > /tmp/celebration-current-server.log 2>&1 &
          echo $! > /tmp/celebration-current-server.pid
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:3099/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/celebration-current-server.log
          exit 1
      - name: Lighthouse storefront and policy shell
        run: |
          run_lh() {
            local url="$1"
            local out="$2"
            npx --yes lighthouse@12.8.2 "$url" \
              --quiet \
              --chrome-flags="--headless --no-sandbox --disable-gpu" \
              --only-categories=performance,accessibility,best-practices,seo \
              --form-factor=mobile \
              --screenEmulation.mobile=true \
              --screenEmulation.width=390 \
              --screenEmulation.height=844 \
              --screenEmulation.deviceScaleFactor=2 \
              --throttling-method=simulate \
              --output=json \
              --output-path="$out"
          }
          run_lh http://127.0.0.1:3099/ /tmp/home-lighthouse.json
          run_lh http://127.0.0.1:3099/policies /tmp/policy-lighthouse.json

          node <<'NODE'
          const fs = require('fs')
          const summarize = path => {
            const report = JSON.parse(fs.readFileSync(path, 'utf8'))
            const score = key => Math.round((report.categories[key]?.score || 0) * 100)
            const audit = key => report.audits[key]?.displayValue || report.audits[key]?.numericValue
            return {
              performance: score('performance'),
              accessibility: score('accessibility'),
              bestPractices: score('best-practices'),
              seo: score('seo'),
              FCP: audit('first-contentful-paint'),
              LCP: audit('largest-contentful-paint'),
              TBT: audit('total-blocking-time'),
              CLS: audit('cumulative-layout-shift'),
              SpeedIndex: audit('speed-index'),
              interactive: audit('interactive')
            }
          }
          const result = { home: summarize('/tmp/home-lighthouse.json'), policy: summarize('/tmp/policy-lighthouse.json') }
          console.log('LIGHTHOUSE_CONTROL=' + JSON.stringify(result))
          fs.writeFileSync('/tmp/control-summary.json', JSON.stringify(result, null, 2))
          NODE
      - name: Upload Lighthouse evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: celebration-hydration-control-lighthouse
          path: |
            /tmp/home-lighthouse.json
            /tmp/policy-lighthouse.json
            /tmp/control-summary.json
          if-no-files-found: warn
          retention-days: 1
