name: Materialize Canonical Loopback Health

on:
  push:
    branches:
      - agent/mangalam-canonical-loopback-health
    paths:
      - ".github/workflows/materialize-canonical-loopback-health.yml"
      - "scripts/materialize-canonical-loopback-health.mjs"

permissions:
  contents: write

concurrency:
  group: materialize-canonical-loopback-health
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: agent/mangalam-canonical-loopback-health
          fetch-depth: 0

      - name: Apply strict canonical health patch
        run: node scripts/materialize-canonical-loopback-health.mjs

      - name: Validate generated source
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/deploy-production-ci.sh
          git diff --check
          test ! -e apps/web/src/server/security/health-probe.ts
          test ! -e apps/web/src/server/security/health-probe.test.ts
          grep -F 'canonical_loopback_health "$CANARY_PORT"' scripts/deploy-production-ci.sh
          grep -F 'process.env.NODE_ENV === "production" && surface === "UNKNOWN"' apps/web/src/proxy.ts

      - name: Remove one-time tooling
        run: rm scripts/materialize-canonical-loopback-health.mjs .github/workflows/materialize-canonical-loopback-health.yml

      - name: Commit materialized fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "security: use canonical loopback deployment health checks"
          git push origin HEAD:agent/mangalam-canonical-loopback-health
