name: Celebration Private Repo Bootstrap Capability
on:
  push:
    branches: [main]
    paths: [.github/workflows/celebration-private-repo-bootstrap.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Attempt private repository creation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BODY=/tmp/repo-create.json
          CODE="$(curl --silent --show-error --output "$BODY" --write-out '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/user/repos \
            -d '{"name":"celebration-commerce","description":"Private production source for Celebration ecommerce","private":true,"has_issues":true,"has_projects":false,"has_wiki":false,"auto_init":false}')"
          echo "CREATE_STATUS=$CODE"
          node - "$BODY" <<'NODE'
          const fs=require('fs'); const v=JSON.parse(fs.readFileSync(process.argv[2],'utf8')||'{}');
          console.log(JSON.stringify({message:v.message||null,full_name:v.full_name||null,private:v.private??null}));
          NODE
          if [ "$CODE" = "201" ]; then
            echo "PRIVATE_REPO_CREATED=true"
          else
            echo "PRIVATE_REPO_CREATED=false"
          fi
