name: Apply offline device setup fix

on:
  push:
    branches:
      - fix/mangalam-offline-device-setup
    paths:
      - scripts/fix-offline-device-setup.mjs
      - .github/workflows/apply-offline-device-setup-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/mangalam-offline-device-setup
          fetch-depth: 0

      - name: Apply guarded source changes
        run: node scripts/fix-offline-device-setup.mjs

      - name: Commit generated changes
        run: |
          set -euo pipefail
          git diff --check
          test -n "$(git status --porcelain)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/server/offline/number-lease-service.ts e2e/mangalam-erp.spec.ts
          git commit -m "fix: make offline device enrollment work on PostgreSQL"
          git push origin HEAD:fix/mangalam-offline-device-setup
