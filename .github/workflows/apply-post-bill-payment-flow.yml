name: Apply post-bill payment flow

on:
  push:
    branches:
      - fix/post-bill-payment-accounting
    paths:
      - .github/workflows/apply-post-bill-payment-flow.yml

permissions:
  contents: write

concurrency:
  group: apply-post-bill-payment-flow
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/post-bill-payment-accounting
          fetch-depth: 0

      - name: Run guarded codemod and capture result
        id: codemod
        shell: bash
        run: |
          set +e
          node scripts/apply-post-bill-payment-flow.mjs > /tmp/codemod.log 2>&1
          status=$?
          cat /tmp/codemod.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            cp /tmp/codemod.log post-bill-payment-codemod-error.txt
          fi
          exit 0

      - name: Commit implementation or diagnostic
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No codemod output" > post-bill-payment-codemod-error.txt
            git add post-bill-payment-codemod-error.txt
          fi
          git commit -m "chore: record post-bill payment codemod result"
          git push origin HEAD:fix/post-bill-payment-accounting
