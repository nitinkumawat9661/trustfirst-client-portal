name: Materialize Billing Print Stock Fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: materialize-billing-print-stock-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/fix-billing-print-estimate-stock'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply focused billing fixes
        run: python scripts/materialize-billing-print-stock-fix.py

      - name: Validate materialized Python script
        run: python -m py_compile scripts/materialize-billing-print-stock-fix.py

      - name: Commit readable source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/components/hardware/quick-pos-form.tsx \
            apps/web/src/components/hardware/estimate-bill-form.tsx \
            apps/web/src/components/hardware/print-button.tsx \
            apps/web/src/components/hardware/print-button.test.ts \
            apps/web/src/server/hardware/trade-service.ts \
            apps/web/src/server/hardware/estimate-sale-lifecycle.test.ts \
            e2e/mangalam-erp.spec.ts
          if git diff --cached --quiet; then
            echo "Source already materialized."
            exit 0
          fi
          git commit -m "fix: repair billing entry print and estimate stock"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
